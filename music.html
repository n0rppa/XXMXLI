<html lang="fi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        img-src 'self' https: data:; 
        script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; 
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; 
        font-src 'self' https://cdnjs.cloudflare.com;
        media-src 'self' blob: https:;
        worker-src blob: 'self';
        connect-src 'self' blob: https:;">
    <title>Musiikki - XXMXLI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --background: #000000;
            --text-primary: #00ff00;
            --text-secondary: #008000;
            --accent: #00ff00;
            --accent-hover: #00cc00;
            --border: #003300;
            --card-bg: #001100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hamburger Menu Button */
        .hamburger {
          position: fixed;
          top: 20px;
          left: 20px;
          z-index: 1100;
          background: var(--accent);
          color: var(--background);
          border: 2px solid var(--accent);
          border-radius: 12px;
          width: 70px;
          height: 70px;
          font-size: 2.5rem;
          cursor: pointer;
          transition: all 0.3s ease;
          box-shadow: 0 4px 15px rgba(0, 255, 0, 0.4);
          font-family: 'Courier New', monospace;
          display: flex;
          align-items: center;
          justify-content: center;
          text-shadow: none;
        }
        
        .hamburger:hover {
          background: var(--accent-hover);
          transform: scale(1.1);
          box-shadow: 0 6px 20px rgba(0, 255, 0, 0.6);
          border-color: var(--accent-hover);
        }
        
        .hamburger:active {
          transform: scale(0.95);
        }

        /* Side Menu Styles */
        .side-menu {
          position: fixed;
          top: 0;
          left: 0;
          height: 100%;
          width: 280px;
          background: #001100;
          border-right: 2px solid var(--accent);
          transform: translateX(-100%);
          transition: transform 0.3s ease;
          z-index: 1099;
          padding-top: 100px;
          display: flex;
          flex-direction: column;
          box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
        }
        .side-menu a {
          color: var(--accent);
          text-decoration: none;
          padding: 1.5rem 2rem;
          border-bottom: 1px solid #003300;
          font-family: 'Courier New', monospace;
          font-size: 1.1rem;
          transition: all 0.3s ease;
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .side-menu a:hover {
          background: #002200;
          padding-left: 2.5rem;
          color: #fff;
          border-left: 4px solid var(--accent);
        }
        .side-menu a i {
          width: 20px;
          text-align: center;
        }
        .side-menu.open {
          transform: translateX(0);
        }
        .header { display:none !important; }

        .main-content {
            margin-top: 80px;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(to bottom, var(--card-bg), var(--background));
            border-bottom: 1px solid var(--accent);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .music-player {
            max-width: 800px;
            margin: 2rem auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .visualizer-container {
            margin: 20px 0;
            background: var(--background);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--accent);
            position: relative;
            height: 150px;
        }

        .visualizer-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .visualizer-controls {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .visualizer-btn {
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.3rem 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .visualizer-btn.active,
        .visualizer-btn:hover {
            background: var(--accent);
            color: var(--background);
            box-shadow: 0 0 10px var(--accent);
        }

        .now-playing {
            text-align: center;
            margin-bottom: 1rem;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .track-info-display {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .track-artist {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .progress-container {
            margin: 1rem 0;
            position: relative;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.1s linear;
            border-radius: 3px;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
            justify-content: center;
        }

        .volume-slider {
            width: 100px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        #waveform {
            margin: 20px 0;
            background: var(--background);
            border-radius: 4px;
            overflow: hidden;
        }

        .player-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0;
        }

        .control-btn {
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            min-width: 44px;
        }

        .control-btn:hover {
            background: var(--accent);
            color: var(--background);
            box-shadow: 0 0 10px var(--accent);
        }

        .playlist {
            margin-top: 2rem;
            border: 1px solid var(--accent);
            border-radius: 8px;
            /* Make the playlist scrollable to ensure all tracks are accessible */
            max-height: 70vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .track-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-item:last-child {
            border-bottom: none;
        }

        .track-item:hover {
            background: var(--card-bg);
            color: var(--accent);
        }

        .track-item.active {
            background: var(--card-bg);
            color: var(--accent);
            border-left: 4px solid var(--accent);
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .track-number {
            font-size: 0.9rem;
            opacity: 0.8;
            min-width: 2.5rem;
        }

        .track-title {
            font-size: 1.1rem;
        }

        .track-duration {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px var(--accent); }
            50% { text-shadow: 0 0 20px var(--accent), 0 0 30px var(--accent); }
            100% { text-shadow: 0 0 10px var(--accent); }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .music-player {
                margin: 1rem;
                padding: 1rem;
            }

            .player-controls {
                gap: 0.5rem;
            }

            .control-btn {
                padding: 0.4rem 0.8rem;
            }

            /* Mobile-specific audio player improvements */
            .visualizer-container {
                height: 120px; /* Smaller on mobile */
            }

            .volume-control {
                flex-direction: column;
                gap: 0.5rem;
                align-items: center;
            }

            .volume-slider {
                width: 150px; /* Wider on mobile for easier control */
            }

            /* Better touch targets for mobile */
            .control-btn, .visualizer-btn {
                min-height: 44px;
                min-width: 44px;
            }

            /* Mobile playlist improvements */
            .track-item {
                padding: 1rem 0.5rem;
            }

            .track-info {
                flex-direction: column;
                gap: 0.25rem;
            }

            .track-title {
                font-size: 1rem;
            }
        }

        /* Mobile compatibility notice */
        .mobile-notice {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid #ffa500;
            color: #ffa500;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 4px;
            text-align: center;
            display: none;
        }

        .mobile-notice.show {
            display: block;
        }
    </style>
</head>

    <!-- Visitor Tracker -->
    <script src="assets/js/static-visitor-tracker.js"></script>

    <script>
        // Debug function - users can run this in browser console
        window.debugMusicPlayer = function() {
            if (window.musicPlayer) {
                console.log('🎵 Music Player Debug Info:');
                console.log('Tracks loaded:', window.musicPlayer.tracks.length);
                console.log('Is mobile:', window.musicPlayer.isMobile);
                console.log('Is iOS:', window.musicPlayer.isIOS);
                console.log('Is Android:', window.musicPlayer.isAndroid);
                console.log('User Agent:', navigator.userAgent);
                console.log('Screen size:', window.innerWidth + 'x' + window.innerHeight);
                console.log('All tracks:', window.musicPlayer.tracks);
                return {
                    trackCount: window.musicPlayer.tracks.length,
                    isMobile: window.musicPlayer.isMobile,
                    tracks: window.musicPlayer.tracks
                };
            } else {
                console.log('❌ Music player not initialized yet');
                return null;
            }
        };

        class MusicPlayer {
            constructor() {
                this.audio = new Audio();
                this.audioContext = null;
                this.analyser = null;
                this.source = null;
                this.canvas = null;
                this.canvasContext = null;
                this.animationId = null;
                this.currentVisualizerType = 'bars';
                this.tracks = [];
                this.currentTrackIndex = 0;
                this.isPlaying = false;
                this.isInitialized = false;
                this.basicMode = false; // Fallback mode without Web Audio API
                
                // Mobile browser detection
                this.isMobile = this.detectMobile();
                this.isIOS = this.detectIOS();
                this.isAndroid = this.detectAndroid();
                
                console.log('Browser detection:', {
                    isMobile: this.isMobile,
                    isIOS: this.isIOS,
                    isAndroid: this.isAndroid
                });
                
                this.init();
            }

            detectMobile() {
                // More accurate mobile detection - don't rely only on screen size
                const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                const isSmallScreen = window.innerWidth <= 768 && window.innerHeight <= 1024;
                
                // Only consider it mobile if it's actually a mobile device OR a touch device with small screen
                // This prevents desktop browsers with small windows from being detected as mobile
                return isMobileUA || (isTouchDevice && isSmallScreen && window.innerWidth < 1024);
            }

            detectIOS() {
                return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                       (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            }

            detectAndroid() {
                return /Android/i.test(navigator.userAgent);
            }

            async init() {
                try {
                    // Load tracks from JSON
                    console.log('Loading tracks from tracklist_complete_all.json...');
                    const response = await fetch('assets/audio/tracklist_complete_all.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    let allTracks = await response.json();
                    
                    // Always show all tracks, let player pick best format
                    this.tracks = allTracks;
                    console.log(`Loaded ${this.tracks.length} tracks (no device filtering)`);
                    
                    this.setupElements();
                    this.setupEventListeners();
                    this.renderPlaylist();
                    
                    if (this.tracks.length > 0) {
                        console.log('Auto-loading first track...');
                        await this.loadTrack(0);
                        
                        // Show mobile notice only on actual mobile devices
                        if (this.isMobile) {
                            setTimeout(() => {
                                const mobileNotice = document.getElementById('mobileNotice');
                                if (mobileNotice) {
                                    mobileNotice.classList.add('show');
                                }
                            }, 1000); // Show after a second so user sees it loaded
                        }
                    } else {
                        console.warn('No compatible tracks available');
                        this.showMobileCompatibilityMessage();
                    }
                } catch (error) {
                    console.error('Error initializing player:', error);
                    // Fallback to mobile-compatible tracks
                    this.tracks = this.getMobileFallbackTracks();
                    
                    this.setupElements();
                    this.renderPlaylist();
                    
                    if (this.tracks.length > 0) {
                        console.log('Auto-loading first fallback track...');
                        await this.loadTrack(0);
                    } else {
                        console.warn('No fallback tracks available');
                        this.showMobileCompatibilityMessage();
                    }
                }
            }

            filterTracksForMobile(allTracks) {
                if (!this.isMobile) {
                    // On desktop, show all tracks but prefer FLAC when available
                    console.log('Desktop mode: showing all tracks');
                    return allTracks;
                }
                
                // On mobile, only show M4A/MP3/WAV files (exclude FLAC)
                const mobileCompatible = allTracks.filter(track => 
                    track.file.endsWith('.m4a') || 
                    track.file.endsWith('.mp3') || 
                    track.file.endsWith('.wav') ||
                    track.file.endsWith('.mp4')
                );
                
                console.log(`Mobile filter: ${allTracks.length} total -> ${mobileCompatible.length} compatible`);
                
                // If we have mobile-compatible tracks, use them
                if (mobileCompatible.length > 0) {
                    return mobileCompatible;
                }
                
                // Fallback to hardcoded mobile tracks if JSON doesn't have compatible ones
                console.log('No compatible tracks in JSON, using fallback tracks');
                return this.getMobileFallbackTracks();
            }

            getMobileFallbackTracks() {
                // Complete mobile-compatible fallback tracks (M4A format)
                return [
                    { id: 1, file: '03.mellow.m4a', title: 'Mellow', artist: 'n0rppa', duration: '4:11' },
                    { id: 2, file: '06.Trippy Instrumental.m4a', title: 'Trippy Instrumental', artist: 'n0rppa', duration: '3:58' },
                    { id: 3, file: '07.strange.m4a', title: 'Strange', artist: 'n0rppa', duration: '5:50' },
                    { id: 4, file: '09.swishaz.m4a', title: 'Swishaz', artist: 'n0rppa', duration: '2:09' },
                    { id: 5, file: '13.rain.m4a', title: 'Rain', artist: 'n0rppa', duration: '2:01' },
                    { id: 6, file: '18.alley.m4a', title: 'Alley', artist: 'n0rppa', duration: '2:13' },
                    { id: 7, file: '20.cloudy_instrumental.m4a', title: 'Cloudy Instrumental', artist: 'n0rppa', duration: '1:07' },
                    { id: 8, file: '21.oldschool_hip-hop_beat.m4a', title: 'Oldschool Hip-Hop Beat', artist: 'n0rppa', duration: '0:59' },
                    { id: 9, file: '22.Hard trap beat.m4a', title: 'Hard Trap Beat', artist: 'n0rppa', duration: '1:11' },
                    { id: 10, file: 'cloudwave lizard.m4a', title: 'Cloudwave Lizard', artist: 'n0rppa', duration: '3:22' },
                    { id: 11, file: 'Drizzle.m4a', title: 'Drizzle', artist: 'n0rppa', duration: '2:45' },
                    { id: 12, file: 'freefall.m4a', title: 'Freefall', artist: 'n0rppa', duration: '3:15' },
                    { id: 13, file: 'ganon.m4a', title: 'Chill Oldschool Beat', artist: 'n0rppa', duration: '1:08' },
                    { id: 14, file: 'happy days.m4a', title: 'Happy Days', artist: 'n0rppa', duration: '2:33' },
                    { id: 15, file: 'neo-memphis trappin.m4a', title: 'Neo-Memphis Trappin', artist: 'n0rppa', duration: '2:48' },
                    { id: 16, file: 'Rain (1).m4a', title: 'Rain (1)', artist: 'n0rppa', duration: '2:12' },
                    { id: 17, file: 'reviant.m4a', title: 'Reviant', artist: 'n0rppa', duration: '3:01' },
                    { id: 18, file: 'tekknobadger.m4a', title: 'Tekknobadger', artist: 'n0rppa', duration: '2:55' }
                ];
            }

            showMobileCompatibilityMessage() {
                // Show mobile compatibility notice
                const mobileNotice = document.getElementById('mobileNotice');
                if (mobileNotice) {
                    mobileNotice.classList.add('show');
                }

                // Update track info for mobile
                document.getElementById('currentTrackTitle').textContent = 'Mobile Audio Player';
                document.getElementById('currentTrackArtist').textContent = 'Tap play to start • Optimized for mobile';

                // Hide visualizer on mobile if no tracks
                if (this.tracks.length === 0) {
                    const visualizerContainer = document.querySelector('.visualizer-container');
                    if (visualizerContainer) {
                        visualizerContainer.style.display = 'none';
                    }
                    const visualizerControls = document.querySelector('.visualizer-controls');
                    if (visualizerControls) {
                        visualizerControls.style.display = 'none';
                    }
                }
            }

            setupElements() {
                this.canvas = document.getElementById('visualizer');
                this.canvasContext = this.canvas.getContext('2d');
                this.resizeCanvas();
                
                // Audio elements
                this.audio.crossOrigin = 'anonymous';
                this.audio.preload = 'metadata';
            }

            resizeCanvas() {
                const container = this.canvas.parentElement;
                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight;
            }

            async setupAudioContext() {
                if (this.audioContext) return;
                
                // On mobile, try Web Audio API but don't force basic mode initially
                if (this.isMobile) {
                    console.log('Mobile device detected - trying Web Audio API with fallback');
                }
                
                try {
                    console.log('Setting up Web Audio API context...');
                    
                    // Create audio context with fallback for older browsers
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) {
                        throw new Error('Web Audio API not supported in this browser');
                    }
                    
                    this.audioContext = new AudioContextClass();
                    console.log('Audio context created, state:', this.audioContext.state);
                    
                    // Create analyser for visualizations
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.analyser.smoothingTimeConstant = 0.8;
                    
                    // Setup visualization data arrays
                    this.bufferLength = this.analyser.frequencyBinCount;
                    this.dataArray = new Uint8Array(this.bufferLength);
                    
                    // Don't connect audio element immediately - wait for user interaction
                    this.isInitialized = true;
                    this.basicMode = false;
                    console.log('Audio context setup complete (visualizer ready)');
                } catch (error) {
                    console.error('Error setting up audio context:', error);
                    
                    if (this.isMobile) {
                        console.log('Web Audio API failed on mobile - enabling basic mode');
                        // On mobile, fall back to basic mode
                        this.basicMode = true;
                        
                        // Hide visualizer on mobile only if Web Audio API completely fails
                        const visualizerContainer = document.querySelector('.visualizer-container');
                        if (visualizerContainer) {
                            visualizerContainer.style.display = 'none';
                        }
                        const visualizerControls = document.querySelector('.visualizer-controls');
                        if (visualizerControls) {
                            visualizerControls.style.display = 'none';
                        }
                    } else {
                        console.log('Falling back to basic audio mode (no visualizations)');
                        this.basicMode = true;
                        
                        // Hide visualizer since it won't work
                        const visualizerContainer = document.querySelector('.visualizer-container');
                        if (visualizerContainer) {
                            visualizerContainer.style.display = 'none';
                        }
                        const visualizerControls = document.querySelector('.visualizer-controls');
                        if (visualizerControls) {
                            visualizerControls.style.display = 'none';
                        }
                        
                        // Show info message
                        document.getElementById('currentTrackTitle').textContent = 'Audio Player (Basic Mode)';
                        document.getElementById('currentTrackArtist').textContent = 'Visualizations disabled - audio only';
                    }
                }
            }

            // Connect HTMLAudioElement to Web Audio API graph for visualizer
            connectAudioToContext() {
                try {
                    if (!this.audioContext || !this.analyser || this.basicMode) return;
                    if (this.source) {
                        try { this.source.disconnect(); } catch (e) {}
                    }
                    this.source = this.audioContext.createMediaElementSource(this.audio);
                    this.source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                    console.log('Connected audio node graph');
                } catch (err) {
                    console.warn('connectAudioToContext failed, disabling visualizer', err);
                    this.basicMode = true;
                }
            }

            setupEventListeners() {
                // Player controls
                document.getElementById('playBtn').addEventListener('click', () => this.togglePlay());
                document.getElementById('stopBtn').addEventListener('click', () => this.stop());
                document.getElementById('prevBtn').addEventListener('click', () => this.previous());
                document.getElementById('nextBtn').addEventListener('click', () => this.next());
                
                // Volume control
                document.getElementById('volumeSlider').addEventListener('input', (e) => {
                    this.audio.volume = e.target.value / 100;
                });
                
                // Progress bar
                const progressBar = document.getElementById('progressBar');
                progressBar.addEventListener('click', (e) => {
                    const rect = progressBar.getBoundingClientRect();
                    const percent = (e.clientX - rect.left) / rect.width;
                    this.audio.currentTime = percent * this.audio.duration;
                });
                
                // Audio events
                this.audio.addEventListener('timeupdate', () => this.updateProgress());
                this.audio.addEventListener('durationchange', () => this.updateDuration());
                this.audio.addEventListener('ended', () => this.next());
                this.audio.addEventListener('play', () => {
                    this.isPlaying = true;
                    this.updatePlayButton();
                    this.startVisualization();
                });
                this.audio.addEventListener('pause', () => {
                    this.isPlaying = false;
                    this.updatePlayButton();
                    this.stopVisualization();
                });
                
                // Visualizer controls
                document.querySelectorAll('.visualizer-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelector('.visualizer-btn.active').classList.remove('active');
                        e.target.classList.add('active');
                        this.currentVisualizerType = e.target.dataset.visualizer;
                    });
                });
                
                // Window resize
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            renderPlaylist() {
                console.log('Rendering playlist with', this.tracks.length, 'tracks');
                const playlist = document.getElementById('playlist');
                if (!playlist) {
                    console.error('Playlist element not found!');
                    return;
                }
                playlist.innerHTML = '';
                
                this.tracks.forEach((track, index) => {
                    console.log(`Rendering track ${index + 1}:`, track);
                    const trackElement = document.createElement('div');
                    trackElement.className = 'track-item';
                    trackElement.innerHTML = `
                        <div class="track-info">
                            <span class="track-number">${(index + 1).toString().padStart(2, '0')}</span>
                            <span class="track-title">${track.title}</span>
                        </div>
                        <span class="track-duration">${track.duration || 'Loading...'}</span>
                    `;
                    trackElement.addEventListener('click', () => {
                        console.log(`Track ${index + 1} clicked: ${track.title}`);
                        this.loadTrack(index);
                    });
                    playlist.appendChild(trackElement);
                });
                
                console.log('Playlist rendered successfully');
            }

            async loadTrack(index) {
                if (index < 0 || index >= this.tracks.length) {
                    console.error(`Invalid track index: ${index}`);
                    return;
                }
                
                this.currentTrackIndex = index;
                const track = this.tracks[index];
                
                console.log(`Loading track ${index + 1}:`, track);
                
                // Update UI immediately
                document.getElementById('currentTrackTitle').textContent = track.title;
                document.getElementById('currentTrackArtist').textContent = (track.artist && track.artist !== 'Unknown Artist') ? track.artist : 'n0rppa';
                
                // Update active track in playlist
                document.querySelectorAll('.track-item').forEach((item, i) => {
                    item.classList.toggle('active', i === index);
                });
                
                // Stop current audio
                this.audio.pause();
                this.audio.currentTime = 0;
                
                return new Promise((resolve, reject) => {
                    // Remove old event listeners
                    this.audio.removeEventListener('error', this.audioErrorHandler);
                    this.audio.removeEventListener('loadstart', this.audioLoadStartHandler);
                    this.audio.removeEventListener('canplay', this.audioCanPlayHandler);
                    this.audio.removeEventListener('loadeddata', this.audioLoadedDataHandler);
                    
                    // Create bound handlers
                    this.audioErrorHandler = (e) => {
                        const audioPath = `assets/audio/${track.file}`;
                        const error = e.target.error;
                        console.error(`Error loading audio file: ${audioPath}`, error);
                        
                        let errorMessage = 'Unknown error';
                        let shouldRetry = false;
                        let isFormatIssue = false;
                        
                        if (error) {
                            // Handle specific Firefox demuxer errors
                            if (error.message && error.message.includes('NS_ERROR_DOM_MEDIA_DEMUXER_ERR')) {
                                errorMessage = 'Audio format not supported - trying alternative';
                                shouldRetry = true;
                                isFormatIssue = true;
                            } else if (error.code === MediaError.MEDIA_ERR_DECODE) {
                                errorMessage = 'Audio decoding failed - file may be corrupted';
                                isFormatIssue = true;
                            } else if (error.code === MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED) {
                                errorMessage = 'Audio format not supported by browser';
                                isFormatIssue = true;
                            } else if (error.code === MediaError.MEDIA_ERR_NETWORK) {
                                errorMessage = 'Network error loading audio';
                                shouldRetry = true;
                            } else {
                                errorMessage = error.message || `Media error code: ${error.code}`;
                            }
                        }
                        
                        // Mobile-specific error messages
                        if (this.isMobile) {
                            if (isFormatIssue) {
                                if (this.isIOS) {
                                    errorMessage = 'iOS Safari has limited audio format support. Try Chrome or Firefox.';
                                } else if (this.isAndroid) {
                                    errorMessage = 'Android browser may not support this audio format. Try a different browser.';
                                } else {
                                    errorMessage = 'Mobile browser has limited audio format support.';
                                }
                            }
                        }
                        
                        document.getElementById('currentTrackTitle').textContent = `Error: ${track.title}`;
                        document.getElementById('currentTrackArtist').textContent = errorMessage;
                        
                        if (shouldRetry && !isFormatIssue) {
                            console.log('Attempting to retry with different loading strategy...');
                            // Try reloading with different approach
                            setTimeout(() => {
                                this.audio.src = '';
                                this.audio.load();
                                setTimeout(() => {
                                    this.audio.src = audioPath;
                                    this.audio.load();
                                }, 100);
                            }, 500);
                        } else if (isFormatIssue && this.isMobile) {
                            // On mobile format issues, try to find alternative format
                            console.log('Format issue on mobile, trying alternative format...');
                            this.tryAlternativeFormat(track);
                        } else {
                            reject(new Error(`Audio load failed: ${errorMessage}`));
                        }
                    };
                    
                    this.audioLoadStartHandler = () => {
                        console.log(`Started loading: ${track.file}`);
                        document.getElementById('currentTrackTitle').textContent = `Loading: ${track.title}`;
                    };
                    
                    this.audioLoadedDataHandler = () => {
                        console.log(`Data loaded for: ${track.file}`);
                        document.getElementById('currentTrackTitle').textContent = track.title;
                        document.getElementById('currentTrackArtist').textContent = (track.artist && track.artist !== 'Unknown Artist') ? track.artist : 'n0rppa';
                        resolve();
                    };
                    
                    this.audioCanPlayHandler = () => {
                        console.log(`Can play: ${track.file}`);
                        document.getElementById('currentTrackTitle').textContent = track.title;
                        document.getElementById('currentTrackArtist').textContent = (track.artist && track.artist !== 'Unknown Artist') ? track.artist : 'n0rppa';
                        if (!this.audioLoadedDataHandler.called) {
                            resolve();
                        }
                    };
                    
                    // Add event listeners
                    this.audio.addEventListener('error', this.audioErrorHandler, { once: true });
                    this.audio.addEventListener('loadstart', this.audioLoadStartHandler, { once: true });
                    this.audio.addEventListener('canplay', this.audioCanPlayHandler, { once: true });
                    this.audio.addEventListener('loadeddata', this.audioLoadedDataHandler, { once: true });
                    // Update duration from metadata when available
                    this.audio.addEventListener('loadedmetadata', () => {
                        if (!isNaN(this.audio.duration)) {
                            const dur = this.formatTime(this.audio.duration);
                            this.tracks[index].duration = dur;
                            const items = document.querySelectorAll('.track-item .track-duration');
                            if (items[index]) items[index].textContent = dur;
                            document.getElementById('totalTime').textContent = dur;
                        }
                    }, { once: true });
                    
                    // Choose best playable source for this browser/device
                    const audioPath = this.getBestPlayableSource(track);
                    const cacheBusted = `${audioPath}?v=${Date.now()}`;
                    console.log(`Setting audio source: ${cacheBusted}`);
                    this.audio.src = cacheBusted;
                    this.audio.load(); // Force reload
                    
                    // Timeout fallback
                    setTimeout(() => {
                        if (!this.audioLoadedDataHandler.called && !this.audioCanPlayHandler.called) {
                            console.warn(`Timeout loading track: ${track.file}`);
                            resolve(); // Don't block, but log the issue
                        }
                    }, 5000);
                });
            }

            // Select the best playable source for the current browser/device
            getBestPlayableSource(track) {
                const baseDir = 'assets/audio/';
                const preferOrder = ['mp3', 'm4a', 'wav', 'ogg', 'flac'];

                // Build candidate list: primary file first, then formats array
                const candidates = [];
                if (track.file) candidates.push(track.file);
                if (Array.isArray(track.formats)) candidates.push(...track.formats);

                // Ensure unique and preserve order
                const seen = new Set();
                const uniqueCandidates = candidates.filter(f => {
                    if (seen.has(f)) return false;
                    seen.add(f);
                    return true;
                });

                // Sort by preferred order of extensions
                const sorted = uniqueCandidates.sort((a, b) => {
                    const ea = (a.split('.').pop() || '').toLowerCase();
                    const eb = (b.split('.').pop() || '').toLowerCase();
                    return preferOrder.indexOf(ea) - preferOrder.indexOf(eb);
                });

                // Always prefer non-FLAC first, regardless of canPlayType (some browsers return empty)
                const nonFlac = sorted.find(f => /\.(mp3|m4a|wav|ogg)$/i.test(f));
                if (nonFlac) return baseDir + nonFlac;
                // If only FLAC exists, return it as last resort
                return baseDir + (sorted[0] || track.file);
            }

            tryAlternativeFormat(track) {
                // Prefer formats listed in track.formats
                if (Array.isArray(track.formats)) {
                    const alt = track.formats.find(f => /\.(m4a|mp3|wav|ogg)$/i.test(f));
                    if (alt) {
                        console.log(`Found alternative format via formats list: ${alt}`);
                        document.getElementById('currentTrackArtist').textContent = `Trying alternative format...`;
                        const altTrack = { ...track, file: alt };
                        const audioPath = this.getBestPlayableSource(altTrack);
                        this.audio.src = `${audioPath}?v=${Date.now()}`;
                        this.audio.load();
                        this.audio.play().catch(() => {});
                        return;
                    }
                }

                // Try common alternative extensions based on base name
                const baseName = track.file.replace(/\.(flac|m4a|mp3|wav|ogg)$/i, '');
                const alternativeFormats = ['.mp3', '.m4a', '.wav', '.ogg'];
                for (const ext of alternativeFormats) {
                    const altFile = baseName + ext;
                    if (altFile !== track.file) {
                        const altTrack = { ...track, file: altFile };
                        const audioPath = this.getBestPlayableSource(altTrack);
                        if (audioPath) {
                            console.log(`Trying constructed alternative format: ${altFile}`);
                            document.getElementById('currentTrackArtist').textContent = `Trying alternative format...`;
                            this.audio.src = `${audioPath}?v=${Date.now()}`;
                            this.audio.load();
                            this.audio.play().catch(() => {});
                            return;
                        }
                    }
                }

                // If no alternative found, show final error
                document.getElementById('currentTrackArtist').textContent = 'No compatible audio format found for this device';
            }

            async togglePlay() {
                try {
                    if (this.isPlaying) {
                        this.audio.pause();
                        return;
                    }
                    
                    // Ensure we have a track loaded
                    if (!this.audio.src && this.tracks.length > 0) {
                        console.log('No audio source, loading first track...');
                        await this.loadTrack(0);
                    }
                    
                    if (!this.audio.src) {
                        throw new Error('No audio tracks available');
                    }
                    
                    console.log('Attempting to play:', this.audio.src);
                    
                    // Set volume
                    this.audio.volume = document.getElementById('volumeSlider').value / 100;
                    
                    // Try basic HTML5 audio first
                    try {
                        await this.audio.play();
                        console.log('HTML5 audio playback started successfully');
                        
                        // Initialize audio context after successful basic playback
                        if (!this.isInitialized) {
                            console.log('Initializing audio system for visualizations...');
                            await this.setupAudioContext();
                        }
                        
                        // Connect to Web Audio API only if visualizations are enabled
                        if (!this.basicMode && this.currentVisualizerType && this.audioContext) {
                            this.connectAudioToContext();
                            
                            // Resume audio context if suspended
                            if (this.audioContext.state === 'suspended') {
                                console.log('Resuming suspended audio context...');
                                await this.audioContext.resume();
                            }
                        }
                        
                        return;
                    } catch (playError) {
                        console.error('HTML5 audio play failed:', playError);
                        throw playError;
                    }
                } catch (error) {
                    console.error('Error in togglePlay:', error);
                    
                    // Check if this is a demuxer error or other media error
                    const isDemuxerError = error.message && (
                        error.message.includes('NS_ERROR_DOM_MEDIA_DEMUXER_ERR') ||
                        error.message.includes('MEDIA_ERR_DECODE') ||
                        error.message.includes('demux')
                    );
                    
                    if (isDemuxerError) {
                        console.log('Demuxer error detected, trying to skip to next track...');
                        document.getElementById('currentTrackTitle').textContent = 'Skipping corrupted track';
                        document.getElementById('currentTrackArtist').textContent = 'Trying next track...';
                        
                        // Try to skip to next working track
                        await this.findAndPlayNextWorkingTrack();
                        return;
                    }
                    
                    // Provide specific error messages
                    let errorMessage = 'Unable to play audio. ';
                    
                    if (error.name === 'NotAllowedError') {
                        errorMessage += 'Browser blocked playback. Click play again to allow audio.';
                    } else if (error.name === 'NotSupportedError') {
                        errorMessage += 'Audio format not supported by your browser.';
                    } else if (error.name === 'AbortError') {
                        errorMessage += 'Playback was interrupted.';
                    } else if (error.message.includes('context') || error.message.includes('audio system')) {
                        errorMessage += 'Audio initialization failed. Trying basic mode...';
                        // Force basic mode and retry
                        this.basicMode = true;
                        this.isInitialized = true;
                        try {
                            await this.audio.play();
                            console.log('Basic mode playback successful');
                            return;
                        } catch (basicError) {
                            errorMessage += ' Basic mode also failed.';
                        }
                    } else {
                        errorMessage += 'Please check your browser settings and try again.';
                    }
                    
                    // Show error in UI
                    document.getElementById('currentTrackTitle').textContent = 'Error: ' + (error.name || 'PlaybackError');
                    document.getElementById('currentTrackArtist').textContent = errorMessage;
                    
                    // Log detailed error for debugging
                    console.error('Detailed error info:', {
                        name: error.name,
                        message: error.message,
                        audioSrc: this.audio.src,
                        audioContextState: this.audioContext?.state,
                        basicMode: this.basicMode,
                        tracksLength: this.tracks.length,
                        currentIndex: this.currentTrackIndex
                    });
                }
            }

            async findAndPlayNextWorkingTrack() {
                const maxAttempts = this.tracks.length;
                let attempts = 0;
                
                while (attempts < maxAttempts) {
                    attempts++;
                    const nextIndex = (this.currentTrackIndex + attempts) % this.tracks.length;
                    
                    try {
                        console.log(`Trying track ${nextIndex + 1}: ${this.tracks[nextIndex].title}`);
                        await this.loadTrack(nextIndex);
                        await this.audio.play();
                        console.log(`Successfully playing track: ${this.tracks[nextIndex].title}`);
                        return;
                    } catch (error) {
                        console.log(`Track ${nextIndex + 1} also failed:`, error.message);
                        // Mark this track as potentially corrupted
                        this.tracks[nextIndex].corrupted = true;
                        continue;
                    }
                }
                
                // If we get here, all tracks failed
                document.getElementById('currentTrackTitle').textContent = 'All tracks failed to load';
                document.getElementById('currentTrackArtist').textContent = 'Please check audio files and browser compatibility';
            }

            stop() {
                this.audio.pause();
                this.audio.currentTime = 0;
                this.updateProgress();
            }

            next() {
                // Skip corrupted tracks
                let nextIndex = (this.currentTrackIndex + 1) % this.tracks.length;
                let attempts = 0;
                
                while (this.tracks[nextIndex]?.corrupted && attempts < this.tracks.length) {
                    nextIndex = (nextIndex + 1) % this.tracks.length;
                    attempts++;
                }
                
                this.loadTrack(nextIndex);
                if (this.isPlaying) {
                    setTimeout(() => this.audio.play(), 100);
                }
            }

            previous() {
                if (this.audio.currentTime > 3) {
                    this.audio.currentTime = 0;
                } else {
                    // Skip corrupted tracks
                    let prevIndex = this.currentTrackIndex === 0 ? this.tracks.length - 1 : this.currentTrackIndex - 1;
                    let attempts = 0;
                    
                    while (this.tracks[prevIndex]?.corrupted && attempts < this.tracks.length) {
                        prevIndex = prevIndex === 0 ? this.tracks.length - 1 : prevIndex - 1;
                        attempts++;
                    }
                    
                    this.loadTrack(prevIndex);
                    if (this.isPlaying) {
                        setTimeout(() => this.audio.play(), 100);
                    }
                }
            }

            updateProgress() {
                if (!this.audio.duration) return;
                
                const percent = (this.audio.currentTime / this.audio.duration) * 100;
                document.getElementById('progressFill').style.width = `${percent}%`;
                document.getElementById('currentTime').textContent = this.formatTime(this.audio.currentTime);
            }

            updateDuration() {
                document.getElementById('totalTime').textContent = this.formatTime(this.audio.duration);
            }

            updatePlayButton() {
                const icon = document.querySelector('#playBtn i');
                icon.className = this.isPlaying ? 'fas fa-pause' : 'fas fa-play';
            }

            formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = Math.floor(seconds % 60);
                return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
            }

            startVisualization() {
                // Skip visualization in basic mode
                if (this.basicMode || !this.analyser) {
                    console.log('Visualization skipped (basic mode or no analyser)');
                    return;
                }
                
                const draw = () => {
                    if (!this.isPlaying) return;
                    
                    this.animationId = requestAnimationFrame(draw);
                    this.analyser.getByteFrequencyData(this.dataArray);
                    this.drawVisualization();
                };
                
                draw();
            }

            stopVisualization() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
                this.clearCanvas();
            }

            clearCanvas() {
                this.canvasContext.fillStyle = '#000000';
                this.canvasContext.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }

            drawVisualization() {
                const width = this.canvas.width;
                const height = this.canvas.height;
                
                this.clearCanvas();
                
                switch (this.currentVisualizerType) {
                    case 'bars':
                        this.drawBars(width, height);
                        break;
                    case 'wave':
                        this.drawWave(width, height);
                        break;
                    case 'circle':
                        this.drawCircle(width, height);
                        break;
                    case 'particles':
                        this.drawParticles(width, height);
                        break;
                    case 'spectrum':
                        this.drawSpectrum(width, height);
                        break;
                }
            }

            drawBars(width, height) {
                const barWidth = width / this.bufferLength * 2.5;
                let x = 0;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const barHeight = (this.dataArray[i] / 255) * height * 0.8;
                    
                    const hue = (i / this.bufferLength) * 120;
                    this.canvasContext.fillStyle = `hsl(${hue}, 100%, 50%)`;
                    
                    this.canvasContext.fillRect(x, height - barHeight, barWidth - 2, barHeight);
                    x += barWidth;
                }
            }

            drawWave(width, height) {
                this.canvasContext.strokeStyle = '#00ff00';
                this.canvasContext.lineWidth = 2;
                this.canvasContext.beginPath();
                
                const sliceWidth = width / this.bufferLength;
                let x = 0;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const v = (this.dataArray[i] / 255) * 2 - 1;
                    const y = (v * height / 2) + (height / 2);
                    
                    if (i === 0) {
                        this.canvasContext.moveTo(x, y);
                    } else {
                        this.canvasContext.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                this.canvasContext.stroke();
            }

            drawCircle(width, height) {
                const centerX = width / 2;
                const centerY = height / 2;
                const radius = Math.min(width, height) / 4;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const angle = (i / this.bufferLength) * Math.PI * 2;
                    const amplitude = (this.dataArray[i] / 255) * radius;
                    
                    const x1 = centerX + Math.cos(angle) * radius;
                    const y1 = centerY + Math.sin(angle) * radius;
                    const x2 = centerX + Math.cos(angle) * (radius + amplitude);
                    const y2 = centerY + Math.sin(angle) * (radius + amplitude);
                    
                    const hue = (i / this.bufferLength) * 360;
                    this.canvasContext.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                    this.canvasContext.lineWidth = 2;
                    this.canvasContext.beginPath();
                    this.canvasContext.moveTo(x1, y1);
                    this.canvasContext.lineTo(x2, y2);
                    this.canvasContext.stroke();
                }
            }

            drawParticles(width, height) {
                for (let i = 0; i < this.bufferLength; i += 4) {
                    const x = Math.random() * width;
                    const y = Math.random() * height;
                    const size = (this.dataArray[i] / 255) * 8 + 2;
                    
                    const hue = (this.dataArray[i] / 255) * 360;
                    this.canvasContext.fillStyle = `hsl(${hue}, 100%, 50%)`;
                    this.canvasContext.beginPath();
                    this.canvasContext.arc(x, y, size, 0, Math.PI * 2);
                    this.canvasContext.fill();
                }
            }

            drawSpectrum(width, height) {
                const gradient = this.canvasContext.createLinearGradient(0, height, 0, 0);
                gradient.addColorStop(0, '#00ff00');
                gradient.addColorStop(0.5, '#ffff00');
                gradient.addColorStop(1, '#ff0000');
                
                this.canvasContext.fillStyle = gradient;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const barHeight = (this.dataArray[i] / 255) * height;
                    const barWidth = width / this.bufferLength;
                    
                    this.canvasContext.fillRect(i * barWidth, height - barHeight, barWidth - 1, barHeight);
                }
            }
        }

        // Initialize player when page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.musicPlayer = new MusicPlayer();
        });

        // Hamburger menu functionality - FIXED VERSION
        document.addEventListener('DOMContentLoaded', function() {

            const sideMenu = document.getElementById('sideMenu');

                document.addEventListener('click', function(e) {
                    if (justToggled) return;
                    if (!sideMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                        closeMenu();
                    }
                });
                
                console.log('✅ Hamburger menu initialized successfully');
            } else {
                console.error('❌ Menu elements not found!');
            }
        });
    </script>
</body>
</html>
