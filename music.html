<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; 
        img-src 'self' https: data:; 
        script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; 
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; 
        font-src 'self' https://cdnjs.cloudflare.com;
        media-src 'self' blob: https:;
        worker-src blob: 'self';
        connect-src 'self' blob: https:;">
    <title>Musiikki - XXMXLI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --background: #000000;
            --text-primary: #00ff00;
            --text-secondary: #008000;
            --accent: #00ff00;
            --accent-hover: #00cc00;
            --border: #003300;
            --card-bg: #001100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hamburger Menu Button */
        .hamburger {
          position: fixed;
          top: 20px;
          left: 20px;
          z-index: 1100;
          background: var(--accent);
          color: var(--background);
          border: 2px solid var(--accent);
          border-radius: 12px;
          width: 70px;
          height: 70px;
          font-size: 2.5rem;
          cursor: pointer;
          transition: all 0.3s ease;
          box-shadow: 0 4px 15px rgba(0, 255, 0, 0.4);
          font-family: 'Courier New', monospace;
          display: flex;
          align-items: center;
          justify-content: center;
          text-shadow: none;
        }
        
        .hamburger:hover {
          background: var(--accent-hover);
          transform: scale(1.1);
          box-shadow: 0 6px 20px rgba(0, 255, 0, 0.6);
          border-color: var(--accent-hover);
        }
        
        .hamburger:active {
          transform: scale(0.95);
        }

        /* Side Menu Styles */
        .side-menu {
          position: fixed;
          top: 0;
          left: 0;
          height: 100%;
          width: 280px;
          background: #001100;
          border-right: 2px solid var(--accent);
          transform: translateX(-100%);
          transition: transform 0.3s ease;
          z-index: 1099;
          padding-top: 100px;
          display: flex;
          flex-direction: column;
          box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
        }
        .side-menu a {
          color: var(--accent);
          text-decoration: none;
          padding: 1.5rem 2rem;
          border-bottom: 1px solid #003300;
          font-family: 'Courier New', monospace;
          font-size: 1.1rem;
          transition: all 0.3s ease;
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .side-menu a:hover {
          background: #002200;
          padding-left: 2.5rem;
          color: #fff;
          border-left: 4px solid var(--accent);
        }
        .side-menu a i {
          width: 20px;
          text-align: center;
        }
        .side-menu.open {
          transform: translateX(0);
        }
        .header { display:none !important; }

        .main-content {
            margin-top: 80px;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(to bottom, var(--card-bg), var(--background));
            border-bottom: 1px solid var(--accent);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .music-player {
            max-width: 800px;
            margin: 2rem auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .visualizer-container {
            margin: 20px 0;
            background: var(--background);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--accent);
            position: relative;
            height: 150px;
        }

        .visualizer-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .visualizer-controls {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .visualizer-btn {
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.3rem 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .visualizer-btn.active,
        .visualizer-btn:hover {
            background: var(--accent);
            color: var(--background);
            box-shadow: 0 0 10px var(--accent);
        }

        .now-playing {
            text-align: center;
            margin-bottom: 1rem;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .track-info-display {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .track-artist {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .progress-container {
            margin: 1rem 0;
            position: relative;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.1s linear;
            border-radius: 3px;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
            justify-content: center;
        }

        .volume-slider {
            width: 100px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        #waveform {
            margin: 20px 0;
            background: var(--background);
            border-radius: 4px;
            overflow: hidden;
        }

        .player-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0;
        }

        .control-btn {
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            min-width: 44px;
        }

        .control-btn:hover {
            background: var(--accent);
            color: var(--background);
            box-shadow: 0 0 10px var(--accent);
        }

        .playlist {
            margin-top: 2rem;
            border: 1px solid var(--accent);
            border-radius: 8px;
            overflow: hidden;
        }

        .track-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-item:last-child {
            border-bottom: none;
        }

        .track-item:hover {
            background: var(--card-bg);
            color: var(--accent);
        }

        .track-item.active {
            background: var(--card-bg);
            color: var(--accent);
            border-left: 4px solid var(--accent);
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .track-number {
            font-size: 0.9rem;
            opacity: 0.8;
            min-width: 2.5rem;
        }

        .track-title {
            font-size: 1.1rem;
        }

        .track-duration {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px var(--accent); }
            50% { text-shadow: 0 0 20px var(--accent), 0 0 30px var(--accent); }
            100% { text-shadow: 0 0 10px var(--accent); }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .music-player {
                margin: 1rem;
                padding: 1rem;
            }

            .player-controls {
                gap: 0.5rem;
            }

            .control-btn {
                padding: 0.4rem 0.8rem;
            }
        }
    </style>
</head>

    <main class="main-content">
        <section class="hero">

            <p>Tuotantoa ja äänimaisemia eri projekteihin</p>
        </section>

        <section class="music-player">
            <div class="now-playing">
                <div class="track-info-display" id="currentTrackTitle">Select a track to play</div>
                <div class="track-artist" id="currentTrackArtist"></div>
            </div>

            <div class="visualizer-controls">
                <button class="visualizer-btn active" data-visualizer="bars">Bars</button>
                <button class="visualizer-btn" data-visualizer="wave">Wave</button>
                <button class="visualizer-btn" data-visualizer="circle">Circle</button>

            <div class="visualizer-container">
                <canvas class="visualizer-canvas" id="visualizer"></canvas>

            <div class="progress-container">

    <!-- Visitor Tracker -->
    <script src="assets/js/static-visitor-tracker.js"></script>

    <script>
        class MusicPlayer {
            constructor() {
                this.audio = new Audio();
                this.audioContext = null;
                this.analyser = null;
                this.source = null;
                this.canvas = null;
                this.canvasContext = null;
                this.animationId = null;
                this.currentVisualizerType = 'bars';
                this.tracks = [];
                this.currentTrackIndex = 0;
                this.isPlaying = false;
                this.isInitialized = false;
                
                this.init();
            }

            async init() {
                try {
                    // Load tracks from JSON
                    console.log('Loading tracks from tracklist.json...');
                    const response = await fetch('assets/audio/tracklist.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    this.tracks = await response.json();
                    console.log(`Loaded ${this.tracks.length} tracks:`, this.tracks);
                    
                    this.setupElements();
                    this.setupEventListeners();
                    this.renderPlaylist();
                    
                    if (this.tracks.length > 0) {
                        console.log('Auto-loading first track...');
                        await this.loadTrack(0);
                    } else {
                        console.warn('No tracks available to load');
                    }
                } catch (error) {
                    console.error('Error initializing player:', error);
                    // Fallback to basic tracks
                    this.tracks = [
                        { file: '10.Frosty.flac', title: 'Frosty', artist: 'n0rppa', duration: '1:47' },
                        { file: 'Rain (1).flac', title: 'Rain', artist: 'n0rppa', duration: '2:01' },
                        { file: 'track1.flac', title: 'Mellow', artist: 'n0rppa', duration: '4:11' },
                        { file: 'track2.flac', title: 'Astrologik', artist: 'n0rppa', duration: '2:38' },
                        { file: 'track3.flac', title: 'Rain (Alt Version)', artist: 'n0rppa', duration: '2:01' },
                        { file: 'track4.flac', title: 'Strange', artist: 'n0rppa', duration: '5:50' },
                        { file: 'track5.flac', title: 'Swishaz', artist: 'n0rppa', duration: '2:09' },
                        { file: 'track6.flac', title: 'Alley', artist: 'n0rppa', duration: '2:13' },
                        { file: 'track7.flac', title: 'Cloudy Instrumental', artist: 'n0rppa', duration: '1:07' },
                        { file: 'track8.flac', title: 'Oldschool Hip-Hop Beat', artist: 'n0rppa', duration: '0:59' },
                        { file: 'track9.flac', title: 'Chill Oldschool Beat', artist: 'n0rppa', duration: '1:08' },
                        { file: 'freefall.wav', title: 'Freefall', artist: 'n0rppa' },
                        { file: 'freefall2.wav', title: 'Freefall 2', artist: 'n0rppa' },
                        { file: 'hollatrillzzZ.wav', title: 'Holla Trillz', artist: 'n0rppa' },
                        { file: 'hop to tha clout.wav', title: 'Hop to tha Clout', artist: 'n0rppa' },
                        { file: 'tekknohammer2025.wav', title: 'Tekknohammer 2025', artist: 'n0rppa' }
                    ];
                    console.log('Using fallback tracks:', this.tracks.length);
                    this.renderPlaylist();
                }
            }

            setupElements() {
                this.canvas = document.getElementById('visualizer');
                this.canvasContext = this.canvas.getContext('2d');
                this.resizeCanvas();
                
                // Audio elements
                this.audio.crossOrigin = 'anonymous';
                this.audio.preload = 'metadata';
            }

            resizeCanvas() {
                const container = this.canvas.parentElement;
                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight;
            }

            async setupAudioContext() {
                if (this.audioContext) return;
                
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.analyser.smoothingTimeConstant = 0.8;
                    
                    this.source = this.audioContext.createMediaElementSource(this.audio);
                    this.source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                    
                    this.bufferLength = this.analyser.frequencyBinCount;
                    this.dataArray = new Uint8Array(this.bufferLength);
                    
                    this.isInitialized = true;
                } catch (error) {
                    console.error('Error setting up audio context:', error);
                }
            }

            setupEventListeners() {
                // Player controls
                document.getElementById('playBtn').addEventListener('click', () => this.togglePlay());
                document.getElementById('stopBtn').addEventListener('click', () => this.stop());
                document.getElementById('prevBtn').addEventListener('click', () => this.previous());
                document.getElementById('nextBtn').addEventListener('click', () => this.next());
                
                // Volume control
                document.getElementById('volumeSlider').addEventListener('input', (e) => {
                    this.audio.volume = e.target.value / 100;
                });
                
                // Progress bar
                const progressBar = document.getElementById('progressBar');
                progressBar.addEventListener('click', (e) => {
                    const rect = progressBar.getBoundingClientRect();
                    const percent = (e.clientX - rect.left) / rect.width;
                    this.audio.currentTime = percent * this.audio.duration;
                });
                
                // Audio events
                this.audio.addEventListener('timeupdate', () => this.updateProgress());
                this.audio.addEventListener('durationchange', () => this.updateDuration());
                this.audio.addEventListener('ended', () => this.next());
                this.audio.addEventListener('play', () => {
                    this.isPlaying = true;
                    this.updatePlayButton();
                    this.startVisualization();
                });
                this.audio.addEventListener('pause', () => {
                    this.isPlaying = false;
                    this.updatePlayButton();
                    this.stopVisualization();
                });
                
                // Visualizer controls
                document.querySelectorAll('.visualizer-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelector('.visualizer-btn.active').classList.remove('active');
                        e.target.classList.add('active');
                        this.currentVisualizerType = e.target.dataset.visualizer;
                    });
                });
                
                // Window resize
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            renderPlaylist() {
                console.log('Rendering playlist with', this.tracks.length, 'tracks');
                const playlist = document.getElementById('playlist');
                if (!playlist) {
                    console.error('Playlist element not found!');
                    return;
                }
                playlist.innerHTML = '';
                
                this.tracks.forEach((track, index) => {
                    console.log(`Rendering track ${index + 1}:`, track);
                    const trackElement = document.createElement('div');
                    trackElement.className = 'track-item';
                    trackElement.innerHTML = `
                        <div class="track-info">
                            <span class="track-number">${(index + 1).toString().padStart(2, '0')}</span>
                            <span class="track-title">${track.title}</span>
                        </div>
                        <span class="track-duration">${track.duration || 'Loading...'}</span>
                    `;
                    trackElement.addEventListener('click', () => {
                        console.log(`Track ${index + 1} clicked: ${track.title}`);
                        this.loadTrack(index);
                    });
                    playlist.appendChild(trackElement);
                });
                
                console.log('Playlist rendered successfully');
            }

            async loadTrack(index) {
                if (index < 0 || index >= this.tracks.length) {
                    console.error(`Invalid track index: ${index}`);
                    return;
                }
                
                this.currentTrackIndex = index;
                const track = this.tracks[index];
                
                console.log(`Loading track ${index + 1}:`, track);
                
                // Update UI
                document.getElementById('currentTrackTitle').textContent = track.title;
                document.getElementById('currentTrackArtist').textContent = track.artist || 'n0rppa';
                
                // Update active track in playlist
                document.querySelectorAll('.track-item').forEach((item, i) => {
                    item.classList.toggle('active', i === index);
                });
                
                // Stop current audio
                this.audio.pause();
                this.audio.currentTime = 0;
                
                // Load audio with error handling
                const audioPath = `assets/audio/${track.file}`;
                console.log(`Loading audio from: ${audioPath}`);
                
                // Remove old event listeners
                this.audio.removeEventListener('error', this.audioErrorHandler);
                this.audio.removeEventListener('loadstart', this.audioLoadStartHandler);
                this.audio.removeEventListener('canplay', this.audioCanPlayHandler);
                
                // Create bound handlers
                this.audioErrorHandler = (e) => {
                    console.error(`Error loading audio file: ${audioPath}`, e);
                    document.getElementById('currentTrackTitle').textContent = `Error: ${track.title}`;
                    document.getElementById('currentTrackArtist').textContent = 'Failed to load audio file';
                };
                
                this.audioLoadStartHandler = () => {
                    console.log(`Started loading: ${audioPath}`);
                };
                
                this.audioCanPlayHandler = () => {
                    console.log(`Can play: ${audioPath}`);
                    document.getElementById('currentTrackTitle').textContent = track.title;
                    document.getElementById('currentTrackArtist').textContent = track.artist || 'n0rppa';
                };
                
                // Add event listeners
                this.audio.addEventListener('error', this.audioErrorHandler, { once: true });
                this.audio.addEventListener('loadstart', this.audioLoadStartHandler, { once: true });
                this.audio.addEventListener('canplay', this.audioCanPlayHandler, { once: true });
                
                // Set the source
                this.audio.src = audioPath;
                this.audio.load(); // Force reload
                
                if (!this.isInitialized) {
                    await this.setupAudioContext();
                }
            }

            async togglePlay() {
                if (!this.isInitialized) {
                    await this.setupAudioContext();
                }
                
                if (this.audioContext && this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                }
                
                if (this.isPlaying) {
                    this.audio.pause();
                } else {
                    try {
                        // Check if audio src is set
                        if (!this.audio.src) {
                            console.log('No audio source, loading first track...');
                            await this.loadTrack(0);
                        }
                        
                        console.log('Attempting to play:', this.audio.src);
                        await this.audio.play();
                        console.log('Audio playback started successfully');
                    } catch (error) {
                        console.error('Error playing audio:', error);
                        
                        // Try to reload the current track
                        if (this.tracks.length > 0) {
                            console.log('Retrying with current track...');
                            await this.loadTrack(this.currentTrackIndex);
                            try {
                                await this.audio.play();
                            } catch (retryError) {
                                console.error('Retry failed:', retryError);
                                alert('Unable to play audio. Please check your browser settings and try again.');
                            }
                        }
                    }
                }
            }

            stop() {
                this.audio.pause();
                this.audio.currentTime = 0;
                this.updateProgress();
            }

            next() {
                const nextIndex = (this.currentTrackIndex + 1) % this.tracks.length;
                this.loadTrack(nextIndex);
                if (this.isPlaying) {
                    setTimeout(() => this.audio.play(), 100);
                }
            }

            previous() {
                if (this.audio.currentTime > 3) {
                    this.audio.currentTime = 0;
                } else {
                    const prevIndex = this.currentTrackIndex === 0 ? this.tracks.length - 1 : this.currentTrackIndex - 1;
                    this.loadTrack(prevIndex);
                    if (this.isPlaying) {
                        setTimeout(() => this.audio.play(), 100);
                    }
                }
            }

            updateProgress() {
                if (!this.audio.duration) return;
                
                const percent = (this.audio.currentTime / this.audio.duration) * 100;
                document.getElementById('progressFill').style.width = `${percent}%`;
                document.getElementById('currentTime').textContent = this.formatTime(this.audio.currentTime);
            }

            updateDuration() {
                document.getElementById('totalTime').textContent = this.formatTime(this.audio.duration);
            }

            updatePlayButton() {
                const icon = document.querySelector('#playBtn i');
                icon.className = this.isPlaying ? 'fas fa-pause' : 'fas fa-play';
            }

            formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = Math.floor(seconds % 60);
                return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
            }

            startVisualization() {
                if (!this.analyser) return;
                
                const draw = () => {
                    if (!this.isPlaying) return;
                    
                    this.animationId = requestAnimationFrame(draw);
                    this.analyser.getByteFrequencyData(this.dataArray);
                    this.drawVisualization();
                };
                
                draw();
            }

            stopVisualization() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
                this.clearCanvas();
            }

            clearCanvas() {
                this.canvasContext.fillStyle = '#000000';
                this.canvasContext.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }

            drawVisualization() {
                const width = this.canvas.width;
                const height = this.canvas.height;
                
                this.clearCanvas();
                
                switch (this.currentVisualizerType) {
                    case 'bars':
                        this.drawBars(width, height);
                        break;
                    case 'wave':
                        this.drawWave(width, height);
                        break;
                    case 'circle':
                        this.drawCircle(width, height);
                        break;
                    case 'particles':
                        this.drawParticles(width, height);
                        break;
                    case 'spectrum':
                        this.drawSpectrum(width, height);
                        break;
                }
            }

            drawBars(width, height) {
                const barWidth = width / this.bufferLength * 2.5;
                let x = 0;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const barHeight = (this.dataArray[i] / 255) * height * 0.8;
                    
                    const hue = (i / this.bufferLength) * 120;
                    this.canvasContext.fillStyle = `hsl(${hue}, 100%, 50%)`;
                    
                    this.canvasContext.fillRect(x, height - barHeight, barWidth - 2, barHeight);
                    x += barWidth;
                }
            }

            drawWave(width, height) {
                this.canvasContext.strokeStyle = '#00ff00';
                this.canvasContext.lineWidth = 2;
                this.canvasContext.beginPath();
                
                const sliceWidth = width / this.bufferLength;
                let x = 0;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const v = (this.dataArray[i] / 255) * 2 - 1;
                    const y = (v * height / 2) + (height / 2);
                    
                    if (i === 0) {
                        this.canvasContext.moveTo(x, y);
                    } else {
                        this.canvasContext.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                this.canvasContext.stroke();
            }

            drawCircle(width, height) {
                const centerX = width / 2;
                const centerY = height / 2;
                const radius = Math.min(width, height) / 4;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const angle = (i / this.bufferLength) * Math.PI * 2;
                    const amplitude = (this.dataArray[i] / 255) * radius;
                    
                    const x1 = centerX + Math.cos(angle) * radius;
                    const y1 = centerY + Math.sin(angle) * radius;
                    const x2 = centerX + Math.cos(angle) * (radius + amplitude);
                    const y2 = centerY + Math.sin(angle) * (radius + amplitude);
                    
                    const hue = (i / this.bufferLength) * 360;
                    this.canvasContext.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                    this.canvasContext.lineWidth = 2;
                    this.canvasContext.beginPath();
                    this.canvasContext.moveTo(x1, y1);
                    this.canvasContext.lineTo(x2, y2);
                    this.canvasContext.stroke();
                }
            }

            drawParticles(width, height) {
                for (let i = 0; i < this.bufferLength; i += 4) {
                    const x = Math.random() * width;
                    const y = Math.random() * height;
                    const size = (this.dataArray[i] / 255) * 8 + 2;
                    
                    const hue = (this.dataArray[i] / 255) * 360;
                    this.canvasContext.fillStyle = `hsl(${hue}, 100%, 50%)`;
                    this.canvasContext.beginPath();
                    this.canvasContext.arc(x, y, size, 0, Math.PI * 2);
                    this.canvasContext.fill();
                }
            }

            drawSpectrum(width, height) {
                const gradient = this.canvasContext.createLinearGradient(0, height, 0, 0);
                gradient.addColorStop(0, '#00ff00');
                gradient.addColorStop(0.5, '#ffff00');
                gradient.addColorStop(1, '#ff0000');
                
                this.canvasContext.fillStyle = gradient;
                
                for (let i = 0; i < this.bufferLength; i++) {
                    const barHeight = (this.dataArray[i] / 255) * height;
                    const barWidth = width / this.bufferLength;
                    
                    this.canvasContext.fillRect(i * barWidth, height - barHeight, barWidth - 1, barHeight);
                }
            }
        }

        // Initialize player when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new MusicPlayer();
        });

        // Hamburger menu functionality - FIXED VERSION
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menuToggle');
            const sideMenu = document.getElementById('sideMenu');
            let justToggled = false;

            function openMenu() { 
                sideMenu.classList.add('open'); 
                console.log('Menu opened');
            }
            function closeMenu() { 
                sideMenu.classList.remove('open'); 
                console.log('Menu closed');
            }
            function toggleMenu() {
                if (sideMenu.classList.contains('open')) closeMenu(); else openMenu();
            }
            
            console.log('Menu elements found:', {
                menuToggle: !!menuToggle,
                sideMenu: !!sideMenu
            });
            
            if (menuToggle && sideMenu) {
                // Main toggle button click
                menuToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    console.log('Menu toggle clicked');
                    toggleMenu();
                    justToggled = true;
                    setTimeout(() => justToggled = false, 150);
                });
                
                // Close menu when clicking a navigation link
                sideMenu.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        console.log('Navigation link clicked, closing menu');
                        closeMenu();
                    });
                });
                
                // Close menu with Escape key
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        closeMenu();
                    }
                });
                
                // Close menu when clicking outside (ignore clicks right after toggle)
                document.addEventListener('click', function(e) {
                    if (justToggled) return;
                    if (!sideMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                        closeMenu();
                    }
                });
                
                console.log('✅ Hamburger menu initialized successfully');
            } else {
                console.error('❌ Menu elements not found!');
            }
        });
    </script>
