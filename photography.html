<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valokuvaus - XXMXLI</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Modal Styles */
        .photo-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .photo-modal.active {
            display: flex;
        }

        .modal-content-wrapper {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
        }

        .close-button {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 40px;
            height: 40px;
            background: #00ffff;
            color: #000;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 0 10px #00ffff;
        }

        .close-button:hover {
            background: #ffffff;
            color: #000;
            transform: scale(1.1);
            box-shadow: 0 0 15px #00ffff;
        }

        /* Gallery item click cursor */
        .gallery img {
            cursor: pointer;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <h1>Valokuvaus</h1>
        <nav>
            <a href="index.html">Etusivu</a>
            <a href="photography.html" class="active">Valokuvaus</a>
            <a href="music.html">Musiikki</a>
            <a href="projects-final.html">Projektit</a>
        </nav>
    </header>

    <main>
        <div class="gallery" id="photoGallery">
            <!-- GALLERY_START -->
            <!-- Kuvagalleria generoidaan automaattisesti update_gallery.py -skriptillä. -->
            <!-- Älä muokkaa tätä osiota käsin, vaan aja skripti uudelleen. -->
            <!-- GALLERY_END -->
        </div>
    </main>

    <!-- Photo Modal -->
    <div id="photoModal" class="photo-modal">
        <div class="modal-content-wrapper">
            <img id="modalImage" class="modal-image" src="" alt="">
            <button id="closeModal" class="close-button">&times;</button>
        </div>
    </div>

    <script>
        // Modal functionality
        const modal = document.getElementById('photoModal');
        const modalImage = document.getElementById('modalImage');
        const closeButton = document.getElementById('closeModal');

        function openModal(src, alt) {
            modalImage.src = src;
            modalImage.alt = alt;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Event listeners
        closeButton.addEventListener('click', closeModal);

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // Add click events to existing gallery images
        document.addEventListener('DOMContentLoaded', () => {
            const gallery = document.getElementById('photoGallery');
            
            // Use event delegation to handle clicks on gallery images
            gallery.addEventListener('click', (e) => {
                if (e.target.tagName === 'IMG') {
                    openModal(e.target.src, e.target.alt);
                }
            });
        });
    </script>
</body>
