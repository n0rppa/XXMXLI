<head>

    <title>XXMXLI - Valokuvaus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --background: #000000;
            --text-primary: #00ff00;
            --text-secondary: #008000;
            --accent: #00ff00;
            --accent-hover: #00cc00;
            --border: #003300;
            --card-bg: #001100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header Styles */
        .header {
            background: rgba(0, 17, 0, 0.95);
            padding: 1rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
            text-shadow: 0 0 5px var(--accent);
        }

        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-link {
            color: var(--text-primary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .nav-link:hover, .nav-link.active {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            text-shadow: 0 0 5px var(--accent);
        }

        /* Main Content */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(to bottom, var(--card-bg), var(--background));
            border-bottom: 1px solid var(--accent);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .grid-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transform: translateY(-5px);
        }

        .grid-item i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .grid-item h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .grid-item p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .grid-item a {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            color: var(--accent);
            text-decoration: none;
            border: 1px solid var(--accent);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-item a:hover {
            background: var(--accent);
            color: var(--background);
            box-shadow: 0 0 15px var(--accent);
        }

        /* Gallery Styles */
        .gallery-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1rem;
            transition: all 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        .gallery-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s ease;
            border: 1px solid var(--border);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        .gallery-item img {
            cursor: pointer;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            animation: modalFadeIn 0.3s ease;
        }

        .modal-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: 2px solid var(--accent);
            box-shadow: 0 0 30px var(--accent);
        }

        .close-button {
            position: absolute;
            top: -50px;
            right: 0;
            background: var(--accent);
            color: var(--background);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--accent);
        }

        .close-button:hover {
            background: var(--accent-hover);
            transform: scale(1.1);
            box-shadow: 0 0 25px var(--accent);
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Animations */
        @keyframes pulse {
            0% {
                text-shadow: 0 0 10px var(--accent);
            }
            50% {
                text-shadow: 0 0 20px var(--accent), 0 0 30px var(--accent);
            }
            100% {
                text-shadow: 0 0 10px var(--accent);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--card-bg);
                flex-direction: column;
                padding: 1rem;
                border-bottom: 1px solid var(--accent);
            }

            .nav-menu.active {
                display: flex;
            }

            .menu-button {
                display: block;
                background: none;
                border: none;
                color: var(--accent);
                font-size: 1.5rem;
                cursor: pointer;
            }

            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

    <!-- Image Modal -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <button class="close-button" id="closeModal">
                <i class="fas fa-times"></i>
            </button>
            <img id="modalImage" class="modal-image" src="" alt="">
        </div>
    </div>

    <script>
        // Mobile menu functionality
        const menuButton = document.querySelector('.menu-button');
        const navMenu = document.querySelector('.nav-menu');

        menuButton.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });

        // Close menu when clicking a link
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
            });
        });

        // Gallery image loading
        document.addEventListener('DOMContentLoaded', function() {
            const galleryItems = document.querySelectorAll('.gallery-item img');
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const closeButton = document.getElementById('closeModal');
            
            galleryItems.forEach(img => {
                img.addEventListener('load', function() {
                    this.style.opacity = '1';
                });
                
                img.addEventListener('error', function() {
                    this.alt = 'Kuva ei latautunut';
                    this.style.opacity = '0.5';
                });
                
                // Set initial opacity for smooth loading
                img.style.opacity = '0';
                img.style.transition = 'opacity 0.3s ease';
                
                // If image is already loaded (cached)
                if (img.complete) {
                    img.style.opacity = '1';
                }

                // Add click event for modal
                img.addEventListener('click', function() {
                    modal.classList.add('active');
                    modalImage.src = this.src;
                    modalImage.alt = this.alt;
                    document.body.style.overflow = 'hidden'; // Prevent background scrolling
                });
            });

            // Close modal functionality
            closeButton.addEventListener('click', closeModal);
            
            // Close modal when clicking outside the image
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeModal();
                }
            });

            // Close modal with Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    closeModal();
                }
            });

            function closeModal() {
                modal.classList.remove('active');
                document.body.style.overflow = ''; // Restore scrolling
                modalImage.src = '';
            }
        });
    </script>
