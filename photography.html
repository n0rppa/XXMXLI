    <link rel="stylesheet" href="assets/css/visitor-tracker.css">
    <style>
        :root {
            --background: #000000;
            --text-primary: #00ff00;
            --text-secondary: #008000;
            --accent: #00ff00;
            --accent-hover: #00cc00;
            --border: #003300;
            --card-bg: #001100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hamburger Menu Button */
        .hamburger {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1100;
            background: var(--accent);
            color: var(--background);
            border: 2px solid var(--accent);
            border-radius: 12px;
            width: 70px;
            height: 70px;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.4);
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: none;
        }
        
        .hamburger:hover {
            background: var(--accent-hover);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 255, 0, 0.6);
            border-color: var(--accent-hover);
        }
        
        .hamburger:active {
            transform: scale(0.95);
        }

        /* Side Menu Styles */
        .side-menu {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 280px;
            background: #001100;
            border-right: 2px solid var(--accent);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1099;
            padding-top: 100px;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
        }

        .side-menu a {
            color: var(--accent);
            text-decoration: none;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #003300;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .side-menu a:hover {
            background: #002200;
            padding-left: 2.5rem;
            color: #fff;
            border-left: 4px solid var(--accent);
        }

        .side-menu a i {
            width: 20px;
            text-align: center;
        }

        .side-menu.open {
            transform: translateX(0);
        }

        /* Header Styles */
        .header {
            display: none !important;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
            text-shadow: 0 0 5px var(--accent);
        }

        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-link {
            color: var(--text-primary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .nav-link:hover, .nav-link.active {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            text-shadow: 0 0 5px var(--accent);
        }

        /* Main Content */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(to bottom, var(--card-bg), var(--background));
            border-bottom: 1px solid var(--accent);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Grid Layout for general content */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Photo Gallery specific styles */
        .grid-container .grid-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.5rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }

        .grid-container .grid-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transform: translateY(-5px);
        }

        .grid-container .grid-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s ease;
            border: 1px solid var(--border);
            cursor: pointer;
            border-radius: 4px;
        }

        .grid-container .grid-item:hover img {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        /* General grid item styles (for non-photo content) */
        .grid-item:not(.grid-container .grid-item) {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .grid-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transform: translateY(-5px);
        }

        .grid-item i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .grid-item h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .grid-item p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .grid-item a {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            color: var(--accent);
            text-decoration: none;
            border: 1px solid var(--accent);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-item a:hover {
            background: var(--accent);
            color: var(--background);
            box-shadow: 0 0 15px var(--accent);
        }

        /* Gallery Images */
        .grid-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .grid-item:hover img {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transform: scale(1.05);
        }

        /* Gallery Styles */
        .grid-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1rem;
            transition: all 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        .grid-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transform: translateY(-5px);
        }

        .grid-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s ease;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .grid-item:hover img {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        /* Image Modal/Lightbox */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            transition: opacity 0.3s ease;
        }

        .image-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            max-width: 95%;
            max-height: 95%;
            margin: auto;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px var(--accent);
            animation: modalZoom 0.4s ease-out;
        }

        @keyframes modalZoom {
            from {
                transform: scale(0.3);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-image {
            width: 100%;
            height: auto;
            display: block;
            max-height: 85vh;
            object-fit: contain;
            background: var(--background);
        }

        .modal-info {
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid var(--accent);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .modal-filename {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 8px;
            text-shadow: 0 0 8px var(--accent);
            font-weight: bold;
        }

        .modal-details {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            color: var(--accent);
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--accent);
            transition: all 0.3s ease;
            user-select: none;
        }

        .close-modal:hover {
            background: var(--accent);
            color: var(--background);
            box-shadow: 0 0 20px var(--accent);
            transform: scale(1.1);
        }

        .close-modal:active {
            transform: scale(0.95);
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 2rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 50%;
            user-select: none;
            font-weight: bold;
        }

        .modal-nav:hover {
            background: var(--accent);
            color: var(--background);
            box-shadow: 0 0 20px var(--accent);
            transform: translateY(-50%) scale(1.1);
        }

        .modal-nav:active {
            transform: translateY(-50%) scale(0.95);
        }

        .modal-prev {
            left: 30px;
        }

        .modal-next {
            right: 30px;
        }

        /* Loading indicator */
        .modal-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent);
            font-size: 3rem;
            animation: spin 1s linear infinite;
            z-index: 10002;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Mobile responsiveness for modal */
        @media (max-width: 768px) {
            .modal-content {
                max-width: 98%;
                max-height: 98%;
                margin: 1%;
            }
            
            .modal-nav {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
            
            .modal-prev {
                left: 15px;
            }
            
            .modal-next {
                right: 15px;
            }
            
            .close-modal {
                top: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
                font-size: 2rem;
            }
            
            .modal-info {
                padding: 15px;
            }
            
            .modal-filename {
                font-size: 1rem;
            }
            
            .modal-details {
                font-size: 0.9rem;
            }
        }

        /* Animations */
        @keyframes pulse {
            0% {
                text-shadow: 0 0 10px var(--accent);
            }
            50% {
                text-shadow: 0 0 20px var(--accent), 0 0 30px var(--accent);
            }
            100% {
                text-shadow: 0 0 10px var(--accent);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--card-bg);
                flex-direction: column;
                padding: 1rem;
                border-bottom: 1px solid var(--accent);
            }

            .nav-menu.active {
                display: flex;
            }

            .menu-button {
                display: block;
                background: none;
                border: none;
                color: var(--accent);
                font-size: 1.5rem;
                cursor: pointer;
            }

            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

    <script>
        // Mobile menu functionality
        const menuButton = document.querySelector('.menu-button');
        const navMenu = document.querySelector('.nav-menu');

        menuButton.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });

        // Close menu when clicking a link
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
            });
        });

        // Gallery image loading and modal functionality
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing gallery...');
            
            const galleryItems = document.querySelectorAll('.grid-item img');
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalFilename = document.getElementById('modalFilename');
            const modalDetails = document.getElementById('modalDetails');
            const modalLoading = document.querySelector('.modal-loading');
            const closeModal = document.querySelector('.close-modal');
            const prevButton = document.querySelector('.modal-prev');
            const nextButton = document.querySelector('.modal-next');
            
            let currentImageIndex = 0;
            let images = [];

            console.log('Gallery items found:', galleryItems.length);
            
            if (!modal) {
                console.error('Modal element #imageModal not found!');
                return;
            }
            
            // Initialize images array
            galleryItems.forEach((img, index) => {
                images.push({
                    src: img.src,
                    alt: img.alt,
                    filename: img.alt || `Image ${index + 1}`
                });
                
                // Set up image loading with better error handling
                img.addEventListener('load', function() {
                    this.style.opacity = '1';
                });
                
                img.addEventListener('error', function() {
                    console.error('Failed to load image:', this.src);
                    this.alt = 'Kuva ei latautunut';
                    this.style.opacity = '0.5';
                    this.style.filter = 'grayscale(100%)';
                });
                
                // Set initial styles for smooth loading
                img.style.opacity = '0';
                img.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                img.style.cursor = 'pointer';
                
                // If image is already loaded (cached)
                if (img.complete && img.naturalHeight !== 0) {
                    img.style.opacity = '1';
                }
                
                // Add click event for modal
                img.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('Image clicked:', index, img.src);
                    openModal(index);
                });

                // Add hover effect
                img.addEventListener('mouseenter', function() {
                    this.style.transform = 'scale(1.05)';
                });
                
                img.addEventListener('mouseleave', function() {
                    this.style.transform = 'scale(1)';
                });
            });

            if (images.length === 0) {
                console.error('No images found in gallery');
                return;
            }
            
            function openModal(index) {
                console.log('Opening modal for image:', index);
                
                currentImageIndex = index;
                modal.classList.add('active');
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
                
                // Add fade-in animation
                modal.style.opacity = '0';
                setTimeout(() => {
                    modal.style.opacity = '1';
                }, 10);
                
                loadModalImage();
            }
            
            function closeModalFunc() {
                console.log('Closing modal');
                
                // Add fade-out animation
                modal.style.opacity = '0';
                
                setTimeout(() => {
                    modal.classList.remove('active');
                    modal.style.display = 'none';
                    document.body.style.overflow = '';
                    if (modalImage) {
                        modalImage.src = '';
                    }
                }, 300);
            }
            
            function loadModalImage() {
                if (currentImageIndex < 0 || currentImageIndex >= images.length) {
                    console.error('Invalid image index:', currentImageIndex);
                    return;
                }
                
                const image = images[currentImageIndex];
                modalLoading.style.display = 'block';
                modalImage.style.display = 'none';
                
                // Create a new image element to preload
                const tempImg = new Image();
                
                tempImg.onload = function() {
                    modalImage.src = tempImg.src;
                    modalLoading.style.display = 'none';
                    modalImage.style.display = 'block';
                    updateModalInfo();
                };
                
                tempImg.onerror = function() {
                    console.error('Failed to load modal image:', image.src);
                    modalLoading.style.display = 'none';
                    modalImage.style.display = 'block';
                    modalImage.alt = 'Kuva ei latautunut';
                    modalImage.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMzMzIi8+CiAgPHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPktlbG1hdG9uIGt1dmE8L3RleHQ+Cjwvc3ZnPg==';
                    updateModalInfo();
                };
                
                tempImg.src = image.src;
            }
            
            function updateModalInfo() {
                const image = images[currentImageIndex];
                modalFilename.textContent = image.filename;
                modalDetails.textContent = `Kuva ${currentImageIndex + 1} / ${images.length}`;
            }
            
            function nextImage() {
                currentImageIndex = (currentImageIndex + 1) % images.length;
                loadModalImage();
            }
            
            function prevImage() {
                currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
                loadModalImage();
            }
            
            // Event listeners with better error handling
            if (closeModal) {
                closeModal.addEventListener('click', closeModalFunc);
            }
            
            if (nextButton) {
                nextButton.addEventListener('click', nextImage);
            }
            
            if (prevButton) {
                prevButton.addEventListener('click', prevImage);
            }
            
            // Close modal when clicking outside the content
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        closeModalFunc();
                    }
                });
            }
            
            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (modal && modal.classList.contains('active')) {
                    switch(e.key) {
                        case 'Escape':
                            closeModalFunc();
                            break;
                        case 'ArrowLeft':
                            e.preventDefault();
                            prevImage();
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            nextImage();
                            break;
                        case 'Home':
                            e.preventDefault();
                            currentImageIndex = 0;
                            loadModalImage();
                            break;
                        case 'End':
                            e.preventDefault();
                            currentImageIndex = images.length - 1;
                            loadModalImage();
                            break;
                    }
                }
            });
            
            // Touch/swipe support for mobile
            let touchStartX = 0;
            let touchEndX = 0;
            
            modal.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            });
            
            modal.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });
            
            function handleSwipe() {
                const swipeThreshold = 50;
                const diff = touchStartX - touchEndX;
                
                if (Math.abs(diff) > swipeThreshold) {
                    if (diff > 0) {
                        // Swipe left - next image
                        nextImage();
                    } else {
                        // Swipe right - previous image
                        prevImage();
                    }
                }
            }
            
            console.log('Gallery initialized with', images.length, 'images');
        });

        (function(){
          const btn=document.getElementById('menuToggle');
          const menu=document.getElementById('sideMenu');
          if(btn && menu){
            btn.addEventListener('click', ()=> menu.classList.toggle('open'));
            menu.querySelectorAll('a').forEach(a=> a.addEventListener('click', ()=> menu.classList.remove('open')));
            document.addEventListener('keydown', e=> { if(e.key==='Escape') menu.classList.remove('open'); });
          }
        })();
    </script>
    <script src="assets/js/visitor-tracker.js"></script>
