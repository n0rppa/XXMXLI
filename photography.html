<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valokuvaus - XXMXLI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --background: #000000;
            --text-primary: #00ff00;
            --text-secondary: #008000;
            --accent: #00ff00;
            --accent-hover: #00cc00;
            --border: #003300;
            --card-bg: #001100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header Styles */
        .header {
            background: rgba(0, 17, 0, 0.95);
            padding: 1rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
            text-shadow: 0 0 5px var(--accent);
        }

        .menu-button {
            display: none;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-link {
            color: var(--text-primary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .nav-link:hover, .nav-link.active {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            text-shadow: 0 0 5px var(--accent);
        }

        /* Main Content */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(to bottom, var(--card-bg), var(--background));
            border-bottom: 1px solid var(--accent);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Gallery Styles */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .gallery-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent);
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .overlay-text {
            color: var(--accent);
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--accent);
        }

        .gallery-info {
            padding: 1.5rem;
        }

        .gallery-info h3 {
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
        }

        .gallery-info p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Modal Styles */
        .photo-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .photo-modal.active {
            display: flex;
        }

        .modal-content-wrapper {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 30px var(--accent);
            border: 2px solid var(--accent);
        }

        .close-button {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 40px;
            height: 40px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 0 10px var(--accent);
        }

        .close-button:hover {
            background: #ffffff;
            color: #000;
            transform: scale(1.1);
            box-shadow: 0 0 15px var(--accent);
        }

        /* No Images Message */
        .no-images {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .no-images i {
            font-size: 4rem;
            margin-bottom: 2rem;
            color: var(--accent);
        }

        .no-images h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        /* Animations */
        @keyframes pulse {
            0% {
                text-shadow: 0 0 10px var(--accent);
            }
            50% {
                text-shadow: 0 0 20px var(--accent), 0 0 30px var(--accent);
            }
            100% {
                text-shadow: 0 0 10px var(--accent);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .menu-button {
                display: block;
            }

            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--card-bg);
                flex-direction: column;
                padding: 1rem;
                border-bottom: 1px solid var(--accent);
            }

            .nav-menu.active {
                display: flex;
            }

            .hero h1 {
                font-size: 2.5rem;
            }

            .gallery {
                grid-template-columns: 1fr;
                padding: 1rem;
            }

            .modal-content-wrapper {
                max-width: 95vw;
                max-height: 95vh;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <a href="index.html" class="logo">XXMXLI</a>
            <button class="menu-button">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">
                    <i class="fas fa-home"></i> Etusivu
                </a></li>
                <li><a href="music.html" class="nav-link">
                    <i class="fas fa-music"></i> Musiikki
                </a></li>
                <li><a href="photography.html" class="nav-link active">
                    <i class="fas fa-camera"></i> Valokuvaus
                </a></li>
                <li><a href="projects.html" class="nav-link">
                    <i class="fas fa-project-diagram"></i> Projektit
                </a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero">
            <h1><i class="fas fa-camera"></i> Valokuvaus</h1>
            <p>// VISUAALISIA TARINOITA //</p>
        </section>

        <div class="gallery" id="photoGallery">
            <!-- GALLERY_START -->
            <!-- Kuvagalleria generoidaan automaattisesti update_gallery.py -skriptillä. -->
            <!-- Älä muokkaa tätä osiota käsin, vaan aja skripti uudelleen. -->
            
            <!-- Esimerkkikuvia, jos ei ole oikeita kuvia -->
            <div class="no-images">
                <i class="fas fa-images"></i>
                <h2>Galleria ladataan...</h2>
                <p>Kuvat generoidaan automaattisesti assets/photos/ -kansiosta</p>
                <p>Lisää kuvia kansioon ja aja update_gallery.py -skripti</p>
            </div>
            
            <!-- GALLERY_END -->
        </div>
    </main>

    <!-- Photo Modal -->
    <div id="photoModal" class="photo-modal">
        <div class="modal-content-wrapper">
            <img id="modalImage" class="modal-image" src="" alt="">
            <button id="closeModal" class="close-button">&times;</button>
        </div>
    </div>

    <script>
        // Mobile menu functionality
        const menuButton = document.querySelector('.menu-button');
        const navMenu = document.querySelector('.nav-menu');

        if (menuButton) {
            menuButton.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!menuButton.contains(e.target) && !navMenu.contains(e.target)) {
                navMenu.classList.remove('active');
            }
        });

        // Close menu when clicking a link
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
            });
        });

        // Modal functionality
        const modal = document.getElementById('photoModal');
        const modalImage = document.getElementById('modalImage');
        const closeButton = document.getElementById('closeModal');

        function openModal(src, alt) {
            modalImage.src = src;
            modalImage.alt = alt;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Event listeners
        closeButton.addEventListener('click', closeModal);

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // Add click events to existing gallery images
        document.addEventListener('DOMContentLoaded', () => {
            const gallery = document.getElementById('photoGallery');
            
            // Use event delegation to handle clicks on gallery images
            gallery.addEventListener('click', (e) => {
                if (e.target.tagName === 'IMG' && !e.target.closest('.no-images')) {
                    openModal(e.target.src, e.target.alt);
                }
            });

            // Check if we have actual gallery items, hide no-images message
            const galleryItems = gallery.querySelectorAll('.gallery-item');
            const noImagesDiv = gallery.querySelector('.no-images');
            
            if (galleryItems.length > 0 && noImagesDiv) {
                noImagesDiv.style.display = 'none';
            }
        });

        console.log('📸 XXMXLI Photography Gallery loaded');
    </script>
</body>
</html>
