    <style>
        :root {
            --background: #000000;
            --text-primary: #00ff00;
            --text-secondary: #008000;
            --accent: #00ff00;
            --accent-hover: #00cc00;
            --border: #003300;
            --card-bg: #001100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hamburger Menu Button */
        .hamburger {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1100;
            background: var(--accent);
            color: var(--background);
            border: 2px solid var(--accent);
            border-radius: 12px;
            width: 70px;
            height: 70px;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.4);
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: none;
        }
        
        .hamburger:hover {
            background: var(--accent-hover);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 255, 0, 0.6);
            border-color: var(--accent-hover);
        }
        
        .hamburger:active {
            transform: scale(0.95);
        }

        /* Side Menu Styles */
        .side-menu {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 280px;
            background: #001100;
            border-right: 2px solid var(--accent);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1099;
            padding-top: 100px;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
        }

        .side-menu a {
            color: var(--accent);
            text-decoration: none;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #003300;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .side-menu a:hover {
            background: #002200;
            padding-left: 2.5rem;
            color: #fff;
            border-left: 4px solid var(--accent);
        }

        .side-menu a i {
            width: 20px;
            text-align: center;
        }

        .side-menu.open {
            transform: translateX(0);
        }

        /* Header Styles */
        .header {
            display: none !important;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
            text-shadow: 0 0 5px var(--accent);
        }

        .nav-menu {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-link {
            color: var(--text-primary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .nav-link:hover, .nav-link.active {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            text-shadow: 0 0 5px var(--accent);
        }

        /* Main Content */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(to bottom, var(--card-bg), var(--background));
            border-bottom: 1px solid var(--accent);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Grid Layout for general content */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Photo Gallery specific styles */
        .grid-container .grid-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.5rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }

        .grid-container .grid-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transform: translateY(-5px);
        }

        .grid-container .grid-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s ease;
            border: 1px solid var(--border);
            cursor: pointer;
            border-radius: 4px;
        }

        .grid-container .grid-item:hover img {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        /* General grid item styles (for non-photo content) */
        .grid-item:not(.grid-container .grid-item) {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .grid-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transform: translateY(-5px);
        }

        .grid-item i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .grid-item h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .grid-item p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .grid-item a {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            color: var(--accent);
            text-decoration: none;
            border: 1px solid var(--accent);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid-item a:hover {
            background: var(--accent);
            color: var(--background);
            box-shadow: 0 0 15px var(--accent);
        }

        /* Gallery Images */
        .grid-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .grid-item:hover img {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transform: scale(1.05);
        }

        /* Image Modal/Lightbox */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-modal.active {
            display: flex !important;
            opacity: 1 !important;
        }

        .modal-content {
            position: relative;
            max-width: 95%;
            max-height: 95%;
            margin: auto;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px var(--accent);
            animation: modalZoom 0.4s ease-out;
        }

        @keyframes modalZoom {
            from {
                transform: scale(0.3);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-image {
            width: 100%;
            height: auto;
            display: block;
            max-height: 85vh;
            object-fit: contain;
            background: var(--background);
        }

        .modal-info {
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid var(--accent);
            color: var(--text-primary);
            text-align: center;
        }

        .modal-filename {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .modal-details {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            color: var(--accent);
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--accent);
            transition: all 0.3s ease;
            user-select: none;
        }

        .close-modal:hover {
            background: var(--accent);
            color: var(--background);
            box-shadow: 0 0 20px var(--accent);
            transform: scale(1.1);
        }

        .close-modal:active {
            transform: scale(0.95);
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 2rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 50%;
            user-select: none;
            font-weight: bold;
        }

        .modal-nav:hover {
            background: var(--accent);
            color: var(--background);
            box-shadow: 0 0 20px var(--accent);
            transform: translateY(-50%) scale(1.1);
        }

        .modal-nav:active {
            transform: translateY(-50%) scale(0.95);
        }

        .modal-prev {
            left: 30px;
        }

        .modal-next {
            right: 30px;
        }

        /* Loading indicator */
        .modal-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent);
            font-size: 3rem;
            animation: spin 1s linear infinite;
            z-index: 10002;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Mobile responsiveness for modal */
        @media (max-width: 768px) {
            .modal-content {
                max-width: 98%;
                max-height: 98%;
                margin: 1%;
            }
            
            .modal-nav {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
            
            .modal-prev {
                left: 15px;
            }
            
            .modal-next {
                right: 15px;
            }
            
            .close-modal {
                top: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
                font-size: 2rem;
            }
            
            .modal-info {
                padding: 15px;
            }
            
            .modal-filename {
                font-size: 1rem;
            }
            
            .modal-details {
                font-size: 0.9rem;
            }
        }

        /* Enhanced blur effects for better visual appeal */
        .image-modal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 255, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(0, 255, 0, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .modal-content {
            position: relative;
            max-width: 95%;
            max-height: 95%;
            margin: auto;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 
                0 0 40px var(--accent),
                0 0 80px rgba(0, 255, 0, 0.3),
                inset 0 0 20px rgba(0, 255, 0, 0.1);
            animation: modalZoom 0.4s ease-out;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10001;
        }

        /* Add subtle glow effect to modal borders */
        .modal-content::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--accent), transparent, var(--accent));
            border-radius: 14px;
            z-index: -1;
            opacity: 0.3;
            animation: borderGlow 3s ease-in-out infinite alternate;
        }

        @keyframes borderGlow {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }

        /* Animations */
        @keyframes pulse {
            0% {
                text-shadow: 0 0 10px var(--accent);
            }
            50% {
                text-shadow: 0 0 20px var(--accent), 0 0 30px var(--accent);
            }
            100% {
                text-shadow: 0 0 10px var(--accent);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--card-bg);
                flex-direction: column;
                padding: 1rem;
                border-bottom: 1px solid var(--accent);
            }

            .nav-menu.active {
                display: flex;
            }

            .menu-button {
                display: block;
                background: none;
                border: none;
                color: var(--accent);
                font-size: 1.5rem;
                cursor: pointer;
            }

            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

    <script>
        // Mobile menu functionality
        const menuButton = document.querySelector('.menu-button');
        const navMenu = document.querySelector('.nav-menu');

        menuButton.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });

        // Close menu when clicking a link
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
            });
        });

        // Enhanced Gallery Modal Functionality
        class PhotoGallery {
            constructor() {
                console.log('PhotoGallery constructor called');
                
                this.modal = document.getElementById('imageModal');
                this.modalImage = document.getElementById('modalImage');
                this.modalFilename = document.getElementById('modalFilename');
                this.modalDetails = document.getElementById('modalDetails');
                this.modalLoading = document.querySelector('.modal-loading');
                this.closeModal = document.querySelector('.close-modal');
                this.prevButton = document.querySelector('.modal-prev');
                this.nextButton = document.querySelector('.modal-next');
                
                console.log('Modal elements found:', {
                    modal: !!this.modal,
                    modalImage: !!this.modalImage,
                    modalFilename: !!this.modalFilename,
                    modalDetails: !!this.modalDetails,
                    closeModal: !!this.closeModal,
                    prevButton: !!this.prevButton,
                    nextButton: !!this.nextButton
                });
                
                this.currentImageIndex = 0;
                this.images = [];
                this.isInitialized = false;
                
                this.init();
            }
            
            init() {
                if (this.isInitialized) return;
                
                console.log('Initializing Photo Gallery...');
                
                // Get all gallery images
                this.images = Array.from(document.querySelectorAll('.grid-item img'));
                
                if (this.images.length === 0) {
                    console.error('No gallery images found!');
                    return;
                }
                
                console.log(`Found ${this.images.length} gallery images`);
                
                // Set up event listeners
                this.setupImageListeners();
                this.setupModalListeners();
                this.setupKeyboardListeners();
                
                this.isInitialized = true;
                console.log('Photo Gallery initialized successfully!');
            }
            
            setupImageListeners() {
                console.log('Setting up image listeners for', this.images.length, 'images');
                
                this.images.forEach((img, index) => {
                    console.log(`Setting up listener for image ${index + 1}:`, img.src);
                    
                    // Add visual feedback
                    img.style.cursor = 'pointer';
                    img.style.transition = 'transform 0.3s ease';
                    
                    img.addEventListener('click', (e) => {
                        console.log('Image clicked!', index, img.src);
                        e.preventDefault();
                        e.stopPropagation();
                        this.openModal(index);
                    });
                    
                    // Add hover effects
                    img.addEventListener('mouseenter', function() {
                        this.style.transform = 'scale(1.05)';
                        this.style.boxShadow = '0 0 15px var(--accent)';
                    });
                    
                    img.addEventListener('mouseleave', function() {
                        this.style.transform = 'scale(1)';
                        this.style.boxShadow = 'none';
                    });
                });
                
                console.log('Image listeners setup complete');
            }
            
            setupModalListeners() {
                // Close modal
                if (this.closeModal) {
                    this.closeModal.addEventListener('click', () => this.closeModalFunc());
                }
                
                // Close on background click
                this.modal.addEventListener('click', (e) => {
                    if (e.target === this.modal) {
                        this.closeModalFunc();
                    }
                });
                
                // Navigation buttons
                if (this.prevButton) {
                    this.prevButton.addEventListener('click', () => this.showPrevious());
                }
                
                if (this.nextButton) {
                    this.nextButton.addEventListener('click', () => this.showNext());
                }
            }
            
            setupKeyboardListeners() {
                document.addEventListener('keydown', (e) => {
                    if (!this.modal.classList.contains('active')) return;
                    
                    switch(e.key) {
                        case 'Escape':
                            this.closeModalFunc();
                            break;
                        case 'ArrowLeft':
                            this.showPrevious();
                            break;
                        case 'ArrowRight':
                            this.showNext();
                            break;
                    }
                });
            }
            
            openModal(index) {
                console.log('openModal called with index:', index);
                
                if (index < 0 || index >= this.images.length) {
                    console.error('Invalid index:', index);
                    return;
                }
                
                this.currentImageIndex = index;
                const img = this.images[index];
                
                console.log('Opening modal for image:', img.src);
                console.log('Modal element:', this.modal);
                console.log('Modal image element:', this.modalImage);
                
                // Show loading
                this.showLoading();
                
                // Update modal content
                this.modalImage.src = img.src;
                this.modalFilename.textContent = img.alt || `Kuva ${index + 1}`;
                this.modalDetails.textContent = `Kuva ${index + 1} / ${this.images.length}`;
                
                // Show modal
                this.modal.classList.add('active');
                
                console.log('Modal should now be visible');
                console.log('Modal display:', getComputedStyle(this.modal).display);
                console.log('Modal classes:', this.modal.className);
                
                // Hide loading when image loads
                this.modalImage.onload = () => {
                    console.log('Image loaded successfully');
                    this.hideLoading();
                };
                
                // Handle loading errors
                this.modalImage.onerror = () => {
                    console.error('Failed to load image:', img.src);
                    this.hideLoading();
                };
                
                console.log(`Opened modal for image ${index + 1}/${this.images.length}`);
            }
            
            closeModalFunc() {
                this.modal.classList.remove('active');
                this.modalImage.src = '';
                console.log('Modal closed');
            }
            
            showPrevious() {
                const newIndex = this.currentImageIndex === 0 ? this.images.length - 1 : this.currentImageIndex - 1;
                this.openModal(newIndex);
            }
            
            showNext() {
                const newIndex = this.currentImageIndex === this.images.length - 1 ? 0 : this.currentImageIndex + 1;
                this.openModal(newIndex);
            }
            
            showLoading() {
                if (this.modalLoading) {
                    this.modalLoading.style.display = 'block';
                }
            }
            
            hideLoading() {
                if (this.modalLoading) {
                    this.modalLoading.style.display = 'none';
                }
            }
        }

        // Initialize gallery when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing gallery...');
            new PhotoGallery();
            
            // Add test button for debugging
            const testButton = document.createElement('button');

            testButton.style.position = 'fixed';
            testButton.style.top = '20px';
            testButton.style.right = '20px';
            testButton.style.zIndex = '9999';
            testButton.style.padding = '10px 15px';
            testButton.style.background = '#00ff00';
            testButton.style.color = '#000';
            testButton.style.border = '2px solid #00ff00';
            testButton.style.borderRadius = '5px';
            testButton.style.cursor = 'pointer';
            testButton.style.fontFamily = 'Courier New, monospace';
            testButton.style.fontSize = '12px';
            document.body.appendChild(testButton);
            
            testButton.addEventListener('click', function() {

                console.log('Modal display before:', getComputedStyle(modal).display);

                    modalDetails.textContent = 'Test modal functionality';
                    modal.classList.add('active');
                    console.log('Modal display after:', getComputedStyle(modal).display);
                    console.log('Modal has active class:', modal.classList.contains('active'));
                }
            });
        });

        // Hamburger menu functionality
        (function(){
          const btn=document.getElementById('menuToggle');
          const menu=document.getElementById('sideMenu');
          if(btn && menu){
            btn.addEventListener('click', ()=> menu.classList.toggle('open'));
            menu.querySelectorAll('a').forEach(a=> a.addEventListener('click', ()=> menu.classList.remove('open')));
            document.addEventListener('keydown', e=> { if(e.key==='Escape') menu.classList.remove('open'); });
          }
        })();
    </script>
