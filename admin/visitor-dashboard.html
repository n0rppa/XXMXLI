<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXMXLI - Visitor Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/visitor-tracker.css">
    <script src="../assets/js/static-visitor-tracker.js"></script>
    <style>
        body {
            margin: 0;
            background: #000000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
        }
        
        .refresh-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            padding: 10px;
            border-radius: 4px;
            z-index: 1000;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #008000;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 15px;
            margin: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="visitor-dashboard">
        <div class="refresh-indicator" id="refreshIndicator">
            <i class="fas fa-sync-alt"></i> Auto-refresh: ON
        </div>
        
        <div class="dashboard-header">
            <h1 class="dashboard-title">
                <i class="fas fa-eye"></i> XXMXLI Visitor Dashboard
            </h1>
            <p>Real-time visitor analytics and security monitoring</p>
        </div>
        
        <div class="dashboard-controls">
            <button class="control-button" onclick="refreshData()">
                <i class="fas fa-refresh"></i> Refresh
            </button>
            <button class="control-button" onclick="toggleAutoRefresh()">
                <i class="fas fa-pause"></i> Toggle Auto-refresh
            </button>
            <button class="control-button" onclick="exportData()">
                <i class="fas fa-download"></i> Export Data
            </button>
            <input type="text" class="filter-input" id="ipFilter" placeholder="Filter by IP..." onkeyup="filterVisitors()">
            <select class="filter-input" id="countryFilter" onchange="filterVisitors()">
                <option value="">All Countries</option>
            </select>
        </div>
        
        <div id="dashboard-content">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> Loading dashboard...
            </div>
        </div>

        <button id="pasteButton" class="btn btn-primary" style="margin-top: 1rem;">
            <i class="fas fa-paste"></i> Paste Clipboard Content
        </button>
        <div id="pasteOutput" style="margin-top: 1rem; color: var(--cyber-green);"></div>
    </div>

    <script>
        class VisitorDashboard {
            constructor() {
                this.autoRefresh = true;
                this.refreshInterval = null;
                this.currentFilter = {
                    ip: '',
                    country: ''
                };
                this.allVisitors = [];
                this.stats = null;
            }

            async init() {
                await this.loadDashboard();
                this.startAutoRefresh();
                
                // Update refresh indicator
                this.updateRefreshIndicator();
            }

            async loadDashboard() {
                try {
                    // Detect if we're running on GitHub Pages or locally
                    const isGitHubPages = window.location.hostname.includes('github.io') || 
                                        window.location.hostname.includes('xxmxli.com');
                    
                    let apiBase;
                    if (isGitHubPages) {
                        // For GitHub Pages/production, use static data or alternative API
                        apiBase = '../data/';
                        await this.loadStaticData();
                        return;
                    } else {
                        // For local development
                        apiBase = '/api/';
                    }
                    
                    // Load overview stats
                    const statsResponse = await fetch(`${apiBase}get-visitor-stats.php?action=overview`);
                    if (!statsResponse.ok) {
                        throw new Error(`HTTP ${statsResponse.status}: ${statsResponse.statusText}`);
                    }
                    this.stats = await statsResponse.json();
                    
                    // Load recent visitors
                    const visitorsResponse = await fetch(`${apiBase}get-visitor-stats.php?action=visitors&limit=100`);
                    if (!visitorsResponse.ok) {
                        throw new Error(`HTTP ${visitorsResponse.status}: ${visitorsResponse.statusText}`);
                    }
                    const visitorsData = await visitorsResponse.json();
                    this.allVisitors = visitorsData.visitors || [];
                    
                    // Load countries for filter
                    const countriesResponse = await fetch(`${apiBase}get-visitor-stats.php?action=countries`);
                    if (!countriesResponse.ok) {
                        throw new Error(`HTTP ${countriesResponse.status}: ${countriesResponse.statusText}`);
                    }
                    const countries = await countriesResponse.json();
                    this.populateCountryFilter(countries);
                    
                    this.renderDashboard();
                    
                } catch (error) {
                    console.error('Failed to load dashboard:', error);
                    this.showError(`Failed to load dashboard data: ${error.message}`);
                    
                    // Fallback to static demo data
                    await this.loadStaticData();
                }
            }

            async loadStaticData() {
                // Fallback static data for GitHub Pages
                try {
                    // First try to load from localStorage (client-side tracking)
                    if (typeof StaticVisitorTracker !== 'undefined') {
                        const visitors = StaticVisitorTracker.getStoredVisits();
                        const dailyStats = StaticVisitorTracker.getDailyStats();
                        
                        if (visitors.length > 0) {
                            this.stats = this.calculateStatsLocal(visitors, dailyStats);
                            this.allVisitors = visitors.slice().reverse().slice(0, 100);
                            
                            // Extract countries for filter
                            const countries = [...new Set(visitors.map(v => v.location?.country || 'Unknown'))]
                                .map(country => ({ name: country, visits: visitors.filter(v => (v.location?.country || 'Unknown') === country).length }))
                                .sort((a, b) => b.visits - a.visits);
                            
                            this.populateCountryFilter(countries);
                            this.renderDashboard();
                            
                            this.showInfo('Using client-side tracking data');
                            return;
                        }
                    }
                    
                    // Fallback to JSON files
                    const visitorsResponse = await fetch('../data/visitors.json');
                    const visitorsData = await visitorsResponse.json();
                    const visitors = visitorsData.visitors || visitorsData;
                    
                    const dailyStatsResponse = await fetch('../data/daily_stats.json');
                    const dailyStats = await dailyStatsResponse.json();
                    
                    // Calculate stats locally
                    this.stats = this.calculateStatsLocal(visitors, dailyStats);
                    this.allVisitors = visitors.slice().reverse().slice(0, 100);
                    
                    // Extract countries for filter
                    const countries = [...new Set(visitors.map(v => v.country || v.location?.country || 'Unknown'))]
                        .map(country => ({ name: country, visits: visitors.filter(v => (v.country || v.location?.country || 'Unknown') === country).length }))
                        .sort((a, b) => b.visits - a.visits);
                    
                    this.populateCountryFilter(countries);
                    this.renderDashboard();
                    
                    // Show notification that we're using static data
                    this.showInfo('Running in static mode - using sample data');
                    
                } catch (error) {
                    console.error('Failed to load static data:', error);
                    this.showError('Failed to load any data. Please check if data files exist.');
                }
            }

            calculateStatsLocal(visitors, dailyStats) {
                const now = Date.now();
                const today = new Date().toISOString().split('T')[0];
                const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                
                return {
                    overview: {
                        totalVisitors: visitors.length,
                        uniqueIPs: new Set(visitors.map(v => v.ip)).size,
                        blockedVisitors: visitors.filter(v => v.blocked || v.isBlocked).length,
                        botVisitors: visitors.filter(v => 
                            (v.securityFlags?.botDetected) || 
                            (v.userAgent && v.userAgent.toLowerCase().includes('bot'))
                        ).length
                    },
                    timeframe: {
                        today: visitors.filter(v => v.timestamp.startsWith(today)).length,
                        last24h: visitors.filter(v => new Date(v.timestamp) > new Date(now - 24 * 60 * 60 * 1000)).length,
                        last7d: visitors.filter(v => new Date(v.timestamp) > new Date(now - 7 * 24 * 60 * 60 * 1000)).length
                    },
                    topCountries: this.getTopItems(visitors, v => v.country || v.location?.country || 'Unknown'),
                    topBrowsers: this.getTopItems(visitors, v => this.extractBrowser(v.userAgent || '')),
                    recentVisitors: visitors.slice(-10).reverse(),
                    dailyTrend: this.calculateDailyTrend(dailyStats)
                };
            }

            getTopItems(visitors, extractor) {
                const counts = {};
                visitors.forEach(v => {
                    const item = extractor(v);
                    counts[item] = (counts[item] || 0) + 1;
                });
                
                return Object.entries(counts)
                    .map(([name, visits]) => ({ name, visits }))
                    .sort((a, b) => b.visits - a.visits)
                    .slice(0, 10);
            }

            extractBrowser(userAgent) {
                if (userAgent.includes('Chrome')) return 'Chrome';
                if (userAgent.includes('Firefox')) return 'Firefox';
                if (userAgent.includes('Safari') && !userAgent.includes('Chrome')) return 'Safari';
                if (userAgent.includes('Edge')) return 'Edge';
                if (userAgent.includes('Opera')) return 'Opera';
                return 'Unknown';
            }

            calculateDailyTrend(dailyStats) {
                const trend = [];
                for (let i = 6; i >= 0; i--) {
                    const date = new Date(Date.now() - i * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                    const dayData = dailyStats[date] || {};
                    trend.push({
                        date,
                        visits: dayData.visits || 0,
                        uniqueIPs: Array.isArray(dayData.uniqueIPs) ? dayData.uniqueIPs.length : (dayData.uniqueIPs || 0),
                        blocked: dayData.blocked || 0
                    });
                }
                return trend;
            }

            showInfo(message) {
                const indicator = document.getElementById('refreshIndicator');
                indicator.innerHTML = `<i class="fas fa-info-circle"></i> ${message}`;
                indicator.style.background = 'rgba(0, 100, 255, 0.1)';
                indicator.style.borderColor = '#0066ff';
                indicator.style.color = '#0066ff';
            }

            renderDashboard() {
                const content = document.getElementById('dashboard-content');
                
                content.innerHTML = `
                    <div class="dashboard-stats">
                        <div class="stat-card">
                            <div class="stat-number">${this.stats.overview.totalVisitors.toLocaleString()}</div>
                            <div class="stat-label">Total Visitors</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${this.stats.overview.uniqueIPs.toLocaleString()}</div>
                            <div class="stat-label">Unique IPs</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${this.stats.timeframe.today.toLocaleString()}</div>
                            <div class="stat-label">Today's Visits</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${this.stats.overview.blockedVisitors.toLocaleString()}</div>
                            <div class="stat-label">Blocked IPs</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${this.stats.overview.botVisitors.toLocaleString()}</div>
                            <div class="stat-label">Bot Visits</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${this.stats.timeframe.last24h.toLocaleString()}</div>
                            <div class="stat-label">Last 24h</div>
                        </div>
                    </div>
                    
                    <div class="visitor-table">
                        <div class="table-header">
                            <i class="fas fa-users"></i> Recent Visitors
                        </div>
                        <div class="visitor-list" id="visitor-list">
                            ${this.renderVisitorList(this.getFilteredVisitors())}
                        </div>
                    </div>
                    
                    <div style="margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="visitor-table">
                            <div class="table-header">
                                <i class="fas fa-globe"></i> Top Countries
                            </div>
                            <div class="visitor-list">
                                ${this.renderTopList(this.stats.topCountries, 'visits')}
                            </div>
                        </div>
                        
                        <div class="visitor-table">
                            <div class="table-header">
                                <i class="fas fa-browser"></i> Top Browsers
                            </div>
                            <div class="visitor-list">
                                ${this.renderTopList(this.stats.topBrowsers, 'visits')}
                            </div>
                        </div>
                    </div>
                `;
            }

            renderVisitorList(visitors) {
                return visitors.map(visitor => {
                    const location = visitor.location || {};
                    const isBlocked = visitor.isBlocked;
                    const isBot = visitor.securityFlags?.botDetected;
                    
                    return `
                        <div class="visitor-item">
                            <div class="visitor-summary">
                                <div>
                                    <div class="visitor-ip">${visitor.ip}</div>
                                    <div class="visitor-location">
                                        ${location.city || 'Unknown'}, ${location.country || 'Unknown'}
                                        ${isBot ? ' 🤖' : ''}
                                    </div>
                                </div>
                                <div class="visitor-time">
                                    ${new Date(visitor.timestamp).toLocaleString()}
                                </div>
                                <div class="visitor-status ${isBlocked ? 'blocked' : 'allowed'}">
                                    ${isBlocked ? 'BLOCKED' : 'ALLOWED'}
                                </div>
                                <div>
                                    <button class="control-button" onclick="showVisitorDetails('${visitor.sessionId}')">
                                        Details
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            renderTopList(data, valueKey) {
                return Object.entries(data).slice(0, 10).map(([key, value]) => `
                    <div class="visitor-item">
                        <div class="visitor-summary">
                            <div>
                                <div class="visitor-ip">${key}</div>
                            </div>
                            <div class="visitor-time">
                                ${typeof value === 'object' ? value[valueKey] : value} visits
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            populateCountryFilter(countries) {
                const select = document.getElementById('countryFilter');
                select.innerHTML = '<option value="">All Countries</option>';
                
                countries.forEach(country => {
                    const option = document.createElement('option');
                    option.value = country.name;
                    option.textContent = `${country.name} (${country.visits})`;
                    select.appendChild(option);
                });
            }

            getFilteredVisitors() {
                return this.allVisitors.filter(visitor => {
                    const matchesIP = !this.currentFilter.ip || 
                                    visitor.ip.toLowerCase().includes(this.currentFilter.ip.toLowerCase());
                    
                    const matchesCountry = !this.currentFilter.country || 
                                         (visitor.location?.country || '').toLowerCase() === this.currentFilter.country.toLowerCase();
                    
                    return matchesIP && matchesCountry;
                });
            }

            filterVisitors() {
                this.currentFilter.ip = document.getElementById('ipFilter').value;
                this.currentFilter.country = document.getElementById('countryFilter').value;
                
                const filteredVisitors = this.getFilteredVisitors();
                document.getElementById('visitor-list').innerHTML = this.renderVisitorList(filteredVisitors);
            }

            startAutoRefresh() {
                if (this.refreshInterval) {
                    clearInterval(this.refreshInterval);
                }
                
                if (this.autoRefresh) {
                    this.refreshInterval = setInterval(() => {
                        this.loadDashboard();
                    }, 30000); // Refresh every 30 seconds
                }
            }

            toggleAutoRefresh() {
                this.autoRefresh = !this.autoRefresh;
                this.updateRefreshIndicator();
                
                if (this.autoRefresh) {
                    this.startAutoRefresh();
                } else {
                    clearInterval(this.refreshInterval);
                }
            }

            updateRefreshIndicator() {
                const indicator = document.getElementById('refreshIndicator');
                indicator.innerHTML = `
                    <i class="fas fa-sync-alt"></i> 
                    Auto-refresh: ${this.autoRefresh ? 'ON' : 'OFF'}
                `;
            }

            showError(message) {
                const content = document.getElementById('dashboard-content');
                content.innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle"></i> ${message}
                    </div>
                `;
            }

            exportData() {
                const dataToExport = {
                    exportDate: new Date().toISOString(),
                    stats: this.stats,
                    visitors: this.allVisitors
                };
                
                const blob = new Blob([JSON.stringify(dataToExport, null, 2)], {
                    type: 'application/json'
                });
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `xxmxli-visitors-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }

        // Global functions
        function refreshData() {
            dashboard.loadDashboard();
        }

        function toggleAutoRefresh() {
            dashboard.toggleAutoRefresh();
        }

        function exportData() {
            dashboard.exportData();
        }

        function filterVisitors() {
            dashboard.filterVisitors();
        }

        function showVisitorDetails(sessionId) {
            const visitor = dashboard.allVisitors.find(v => v.sessionId === sessionId);
            if (visitor) {
                alert(`Visitor Details:\n\n${JSON.stringify(visitor, null, 2)}`);
            }
        }

        // Initialize dashboard
        const dashboard = new VisitorDashboard();
        dashboard.init();

        // Function to handle clipboard paste
        document.getElementById('pasteButton').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('pasteOutput').innerText = text || 'Clipboard is empty';
            } catch (err) {
                document.getElementById('pasteOutput').innerText = 'Failed to read clipboard content';
                console.error('Error reading clipboard:', err);
            }
        });
    </script>
</body>
</html>
