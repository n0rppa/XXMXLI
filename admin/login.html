<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - XXMXLI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --cyber-green: #00ff00;
            --cyber-dark: #000000;
            --cyber-accent: #003300;
            --cyber-glow: 0 0 10px #00ff00;
            --cyber-glow-strong: 0 0 20px #00ff00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--cyber-dark);
            color: var(--cyber-green);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(0, 255, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 0, 0.05) 0%, transparent 50%);
        }

        .login-container {
            background: linear-gradient(135deg, rgba(0, 17, 0, 0.9) 0%, rgba(0, 34, 0, 0.9) 100%);
            border: 2px solid var(--cyber-accent);
            border-radius: 12px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--cyber-glow-strong);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, var(--cyber-green), transparent);
            z-index: -1;
            border-radius: 12px;
            animation: borderGlow 3s linear infinite;
        }

        @keyframes borderGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-title {
            font-size: 2.5rem;
            color: var(--cyber-green);
            text-shadow: var(--cyber-glow);
            margin-bottom: 0.5rem;
            animation: cyberGlow 2s ease-in-out infinite alternate;
        }

        .login-subtitle {
            color: #00cc00;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            color: var(--cyber-green);
            margin-bottom: 0.5rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background-color: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--cyber-accent);
            border-radius: 4px;
            color: var(--cyber-green);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--cyber-green);
            box-shadow: var(--cyber-glow);
        }

        .form-input::placeholder {
            color: #004400;
        }

        .login-button {
            width: 100%;
            padding: 1rem;
            background-color: var(--cyber-green);
            color: var(--cyber-dark);
            border: none;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--cyber-glow);
        }

        .login-button:hover {
            background-color: #00cc00;
            transform: translateY(-2px);
            box-shadow: var(--cyber-glow-strong);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            background-color: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }

        .success-message {
            background-color: rgba(0, 255, 0, 0.1);
            border: 1px solid var(--cyber-green);
            color: var(--cyber-green);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
        }

        .back-link a {
            color: #00cc00;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            color: var(--cyber-green);
            text-shadow: var(--cyber-glow);
        }

        @keyframes cyberGlow {
            from { text-shadow: 0 0 5px #00ff00; }
            to { text-shadow: 0 0 15px #00ff00, 0 0 25px #00ff00; }
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -2;
            opacity: 0.1;
        }

        .admin-info {
            background-color: rgba(0, 255, 0, 0.05);
            border: 1px solid var(--cyber-accent);
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .credentials-hint {
            color: #008000;
            font-size: 0.8rem;
            margin-top: 1rem;
            text-align: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <canvas class="matrix-bg"></canvas>

    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">
                <i class="fas fa-shield-alt"></i>
                ADMIN
            </h1>
            <p class="login-subtitle">Secure Access Portal</p>
        </div>

        <div class="admin-info">
            <p><strong>Super User Access</strong></p>
            <p>Login to access all admin panel frameworks</p>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-triangle"></i>
            Invalid credentials. Access denied.
        </div>

        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i>
            Authentication successful. Redirecting...
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">
                    <i class="fas fa-user"></i> Username
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="login-button">
                <i class="fas fa-sign-in-alt"></i>
                Access Admin Panel
            </button>
        </form>



        <div class="back-link">
            <a href="../index.html">
                <i class="fas fa-arrow-left"></i>
                Back to Main Site
            </a>
        </div>
    </div>

    <script>
        // Matrix rain effect
        function initMatrixRain() {
            const canvas = document.querySelector('.matrix-bg');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const characters = '01';
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = [];

            for (let i = 0; i < columns; i++) {
                drops[i] = 1;
            }

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#00ff00';
                ctx.font = fontSize + 'px Courier New';

                for (let i = 0; i < drops.length; i++) {
                    const text = characters[Math.floor(Math.random() * characters.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            setInterval(draw, 33);

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        // Login functionality
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            // Supported users with new secure passwords
            const users = [
                { user: 'xxmxli', pass: 'Sec#2025$Admin!7x9' },
                { user: 'nikob', pass: 'Adm1n@2025#Secure8' },
                { user: 'admin', pass: 'XXM*2025$Super!9z' }
            ];
            const found = users.find(x => x.user === username && x.pass === password);
            if (found) {
                successMessage.style.display = 'block';
                sessionStorage.setItem('adminAuth', 'true');
                sessionStorage.setItem('adminUser', username);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                errorMessage.style.display = 'block';
                document.getElementById('password').value = '';
                const container = document.querySelector('.login-container');
                container.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    container.style.animation = '';
                }, 500);
            }
        });

        // Initialize matrix effect
        initMatrixRain();
    </script>
</body>
</html>
