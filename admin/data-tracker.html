<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https:;">
    <title>XXMXLI - Advanced Data Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
    <style>
        :root {
            --cyber-green: #00ff00;
            --cyber-dark-green: #008000;
            --cyber-bg: #0c0c0c;
            --cyber-bg-light: #1a1a1a;
            --cyber-red: #ff0000;
            --cyber-blue: #0088ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, var(--cyber-bg) 0%, var(--cyber-bg-light) 100%);
            color: var(--cyber-green);
            min-height: 100vh;
            overflow-x: auto;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.05;
        }

        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(0, 255, 0, 0.05);
            border: 2px solid var(--cyber-green);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
        }

        .dashboard-title {
            font-size: 3rem;
            color: var(--cyber-green);
            text-shadow: 0 0 20px var(--cyber-green);
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px var(--cyber-green); }
            to { text-shadow: 0 0 30px var(--cyber-green), 0 0 40px var(--cyber-green); }
        }

        .dashboard-subtitle {
            color: var(--cyber-dark-green);
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid var(--cyber-green);
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-button {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid var(--cyber-green);
            color: var(--cyber-green);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-button:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            transform: translateY(-2px);
        }

        .filter-input {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--cyber-green);
            color: var(--cyber-green);
            padding: 8px 12px;
            border-radius: 5px;
            font-family: inherit;
        }

        .filter-input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .status-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid var(--cyber-green);
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 1000;
            color: var(--cyber-green);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid var(--cyber-green);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 0, 0.1), transparent);
            transition: left 0.5s;
        }

        .stat-card:hover::before {
            left: 100%;
        }

        .stat-card:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.3);
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--cyber-green);
            text-shadow: 0 0 10px var(--cyber-green);
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--cyber-dark-green);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .content-section {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid var(--cyber-green);
            border-radius: 10px;
            padding: 25px;
        }

        .section-title {
            color: var(--cyber-green);
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-shadow: 0 0 5px var(--cyber-green);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-container {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid var(--cyber-green);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            position: relative;
            height: 500px;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
        }

        .table-container {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid var(--cyber-green);
            border-radius: 10px;
            padding: 25px;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            color: var(--cyber-green);
        }

        .data-table th,
        .data-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        }

        .data-table th {
            background: rgba(0, 255, 0, 0.1);
            color: var(--cyber-green);
            font-weight: bold;
            text-shadow: 0 0 5px var(--cyber-green);
            position: sticky;
            top: 0;
        }

        .data-table tr:hover {
            background: rgba(0, 255, 0, 0.05);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--cyber-dark-green);
            font-size: 1.2rem;
        }

        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid var(--cyber-red);
            color: var(--cyber-red);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            text-align: center;
        }

        .success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid var(--cyber-green);
            color: var(--cyber-green);
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 255, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--cyber-green);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(0, 255, 0, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--cyber-green);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--cyber-green);
        }

        @media (max-width: 768px) {
            .dashboard-title {
                font-size: 2rem;
            }
            
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
        }
    </style>
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="dashboard-header">
            <h1 class="dashboard-title">
                <i class="fas fa-chart-line"></i> XXMXLI Data Tracker
            </h1>
            <p class="dashboard-subtitle">Advanced Analytics & Visitor Intelligence</p>
        </div>

        <div id="loading" class="loading">
            <i class="fas fa-spinner fa-spin"></i> Loading analytics data...
        </div>

        <div id="error" class="error" style="display: none;">
            <i class="fas fa-exclamation-triangle"></i> <span id="error-message"></span>
        </div>

        <div id="dashboard-content" style="display: none;">
            <div class="stats-grid" id="stats-grid">
                <!-- Stats will be dynamically inserted here -->
            </div>

            <div class="chart-container">
                <h2 class="section-title">
                    <i class="fas fa-chart-area"></i> Daily Visitor Trends
                </h2>
                <canvas id="visitorChart"></canvas>
            </div>

            <div class="table-container">
                <h2 class="section-title">
                    <i class="fas fa-table"></i> Daily Statistics
                </h2>
                <table>
                    <thead>
                        <tr>
                            <th><i class="fas fa-calendar"></i> Date</th>
                            <th><i class="fas fa-users"></i> Total Visits</th>
                            <th><i class="fas fa-user-friends"></i> Unique IPs</th>
                            <th><i class="fas fa-shield-alt"></i> Blocked</th>
                            <th><i class="fas fa-globe"></i> Top Country</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <!-- Data will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        class FullDataTracker {
            constructor() {
                this.dailyStats = {};
                this.visitors = [];
                this.chart = null;
                this.isLoading = false;
            }

            async init() {
                await this.loadAllData();
                this.setupEventListeners();
                setInterval(() => this.autoRefresh(), 30000); // Auto refresh every 30 seconds
            }

            async loadAllData() {
                this.showLoading(true);
                try {
                    // Load daily stats
                    const dailyResponse = await fetch('../data/daily_stats.json');
                    if (dailyResponse.ok) {
                        this.dailyStats = await dailyResponse.json();
                    }

                    // Load visitor data
                    const visitorsResponse = await fetch('../data/visitors.json');
                    if (visitorsResponse.ok) {
                        const visitorsData = await visitorsResponse.json();
                        this.visitors = visitorsData.visitors || visitorsData || [];
                    }

                    this.renderDashboard();
                    this.showLoading(false);
                } catch (error) {
                    this.showError(`Failed to load data: ${error.message}`);
                    this.showLoading(false);
                }
            }

            showLoading(show) {
                document.getElementById('loading').style.display = show ? 'block' : 'none';
                document.getElementById('dashboard-content').style.display = show ? 'none' : 'block';
            }

            showError(message) {
                document.getElementById('error-message').textContent = message;
                document.getElementById('error').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('error').style.display = 'none';
                }, 5000);
            }

            calculateOverallStats() {
                const totalVisits = Object.values(this.dailyStats).reduce((sum, day) => sum + (day.visits || 0), 0);
                const totalBlocked = Object.values(this.dailyStats).reduce((sum, day) => sum + (day.blocked || 0), 0);
                const uniqueIPs = new Set();
                
                this.visitors.forEach(visitor => {
                    if (visitor.ip) uniqueIPs.add(visitor.ip);
                });

                const countries = {};
                Object.values(this.dailyStats).forEach(day => {
                    if (day.countries) {
                        Object.entries(day.countries).forEach(([country, count]) => {
                            countries[country] = (countries[country] || 0) + count;
                        });
                    }
                });

                const topCountry = Object.entries(countries).sort((a, b) => b[1] - a[1])[0];

                return {
                    totalVisits,
                    uniqueIPs: uniqueIPs.size,
                    totalBlocked,
                    blockRate: totalVisits > 0 ? ((totalBlocked / totalVisits) * 100).toFixed(1) : 0,
                    topCountry: topCountry ? topCountry[0] : 'Unknown',
                    totalDays: Object.keys(this.dailyStats).length
                };
            }

            renderStats() {
                const stats = this.calculateOverallStats();
                const statsGrid = document.getElementById('stats-grid');
                
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number">${stats.totalVisits.toLocaleString()}</div>
                        <div class="stat-label">Total Visits</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.uniqueIPs.toLocaleString()}</div>
                        <div class="stat-label">Unique Visitors</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.totalBlocked.toLocaleString()}</div>
                        <div class="stat-label">Blocked Attempts</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.blockRate}%</div>
                        <div class="stat-label">Block Rate</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.topCountry}</div>
                        <div class="stat-label">Top Country</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.totalDays}</div>
                        <div class="stat-label">Days Tracked</div>
                    </div>
                `;
            }

            renderTable() {
                const tableBody = document.getElementById('dataTableBody');
                tableBody.innerHTML = '';

                const sortedDates = Object.keys(this.dailyStats).sort().reverse();

                sortedDates.forEach(date => {
                    const dayData = this.dailyStats[date];
                    const row = document.createElement('tr');
                    
                    const topCountry = dayData.countries ? 
                        Object.entries(dayData.countries).sort((a, b) => b[1] - a[1])[0]?.[0] || 'Unknown' : 
                        'Unknown';

                    row.innerHTML = `
                        <td>${date}</td>
                        <td>${(dayData.visits || 0).toLocaleString()}</td>
                        <td>${dayData.uniqueIPs || 0}</td>
                        <td>${(dayData.blocked || 0).toLocaleString()}</td>
                        <td>${topCountry}</td>
                    `;

                    tableBody.appendChild(row);
                });
            }

            renderChart() {
                const ctx = document.getElementById('visitorChart').getContext('2d');
                
                if (this.chart) {
                    this.chart.destroy();
                }

                const sortedDates = Object.keys(this.dailyStats).sort();
                const visits = sortedDates.map(date => this.dailyStats[date].visits || 0);
                const blocked = sortedDates.map(date => this.dailyStats[date].blocked || 0);
                const unique = sortedDates.map(date => this.dailyStats[date].uniqueIPs || 0);

                this.chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: sortedDates,
                        datasets: [
                            {
                                label: 'Total Visits',
                                data: visits,
                                borderColor: '#00ff00',
                                backgroundColor: 'rgba(0, 255, 0, 0.1)',
                                fill: true,
                                tension: 0.4
                            },
                            {
                                label: 'Blocked',
                                data: blocked,
                                borderColor: '#ff0000',
                                backgroundColor: 'rgba(255, 0, 0, 0.1)',
                                fill: false,
                                tension: 0.4
                            },
                            {
                                label: 'Unique IPs',
                                data: unique,
                                borderColor: '#0088ff',
                                backgroundColor: 'rgba(0, 136, 255, 0.1)',
                                fill: false,
                                tension: 0.4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    color: '#00ff00'
                                },
                                grid: {
                                    color: '#004400'
                                }
                            },
                            x: {
                                ticks: {
                                    color: '#00ff00'
                                },
                                grid: {
                                    color: '#004400'
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#00ff00'
                                }
                            }
                        }
                    }
                });
            }

            renderDashboard() {
                this.renderStats();
                this.renderTable();
                this.renderChart();
            }

            setupEventListeners() {
                // Add export functionality
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'e') {
                        e.preventDefault();
                        this.exportData();
                    }
                });
            }

            exportData() {
                const exportData = {
                    exportDate: new Date().toISOString(),
                    dailyStats: this.dailyStats,
                    visitors: this.visitors,
                    summary: this.calculateOverallStats()
                };

                const blob = new Blob([JSON.stringify(exportData, null, 2)], {
                    type: 'application/json'
                });

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `xxmxli-data-export-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            async autoRefresh() {
                if (!this.isLoading) {
                    console.log('Auto-refreshing data...');
                    await this.loadAllData();
                }
            }
        }

        // Initialize the full data tracker
        const dataTracker = new FullDataTracker();
        
        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', () => {
            dataTracker.init();
        });

        // If DOM is already loaded
        if (document.readyState === 'loading') {
            // Still loading
        } else {
            // Already loaded
            dataTracker.init();
        }
    </script>
</body>
</html>
