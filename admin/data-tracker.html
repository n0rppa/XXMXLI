<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Tracker - XXMXLI</title>
    <link rel="stylesheet" href="../assets/css/visitor-tracker.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        .dashboard {
            padding: 20px;
        }

        .chart-container {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
        }

        .table-container {
            margin: 20px auto;
            width: 90%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Data Tracker</h1>
        <p>Analyze visitor data and trends.</p>

        <div class="chart-container">
            <canvas id="visitorChart"></canvas>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Total Visits</th>
                        <th>Unique IPs</th>
                        <th>Blocked</th>
                        <th>Top Country</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- Data will be dynamically inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('../data/daily_stats.json');
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching data:', error);
                return null;
            }
        }

        function populateTable(data) {
            const tableBody = document.getElementById('dataTableBody');
            tableBody.innerHTML = '';

            Object.keys(data).forEach(date => {
                const row = document.createElement('tr');
                const dayData = data[date];

                row.innerHTML = `
                    <td>${date}</td>
                    <td>${dayData.visits}</td>
                    <td>${dayData.uniqueIPs}</td>
                    <td>${dayData.blocked}</td>
                    <td>${Object.keys(dayData.countries || {})[0] || 'Unknown'}</td>
                `;

                tableBody.appendChild(row);
            });
        }

        function renderChart(data) {
            const ctx = document.getElementById('visitorChart').getContext('2d');
            const labels = Object.keys(data);
            const visits = labels.map(date => data[date].visits);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Daily Visits',
                        data: visits,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: true,
                        }
                    }
                }
            });
        }

        async function init() {
            const data = await fetchData();
            if (data) {
                populateTable(data);
                renderChart(data);
            }
        }

        init();
    </script>
</body>
</html>
