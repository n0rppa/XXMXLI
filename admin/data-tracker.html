<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXMXLI - Data Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/visitor-tracker.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .dashboard {
            padding: 20px;
        }

        .chart-container {
            margin: 20px 0;
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-section input,
        .filter-section select {
            margin-right: 10px;
            padding: 5px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        .data-table th {
            background-color: #f2f2f2;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Data Tracker</h1>

        <div class="filter-section">
            <input type="text" id="ipFilter" placeholder="Filter by IP">
            <select id="countryFilter">
                <option value="">All Countries</option>
            </select>
            <button onclick="applyFilters()">Apply Filters</button>
        </div>

        <div class="chart-container">
            <canvas id="visitorChart"></canvas>
        </div>

        <table class="data-table" id="dataTable">
            <thead>
                <tr>
                    <th>IP Address</th>
                    <th>Country</th>
                    <th>Visits</th>
                    <th>Last Visit</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data rows will be dynamically inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('../data/visitors.json');
                const data = await response.json();
                return data.visitors || [];
            } catch (error) {
                console.error('Error fetching data:', error);
                return [];
            }
        }

        function renderChart(data) {
            const ctx = document.getElementById('visitorChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(item => item.country || 'Unknown'),
                    datasets: [{
                        label: 'Visits',
                        data: data.map(item => item.visits || 0),
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function renderTable(data) {
            const tableBody = document.getElementById('dataTable').querySelector('tbody');
            tableBody.innerHTML = data.map(visitor => `
                <tr>
                    <td>${visitor.ip || 'Unknown'}</td>
                    <td>${visitor.country || 'Unknown'}</td>
                    <td>${visitor.visits || 0}</td>
                    <td>${new Date(visitor.timestamp).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        async function init() {
            const data = await fetchData();
            renderChart(data);
            renderTable(data);
        }

        function applyFilters() {
            // Implement filtering logic here
        }

        init();
    </script>
</body>
</html>
