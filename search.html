<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search - XXMXLI</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lunr/lunr.js"></script>
</head>
<body>
  <main style="padding:2rem;max-width:900px;margin:0 auto;color:#0f0;background:#000;min-height:80vh">
    <h1>Search</h1>
    <input id="q" placeholder="Search" style="width:100%;padding:0.8rem;margin-bottom:1rem;font-family:monospace">
    <div id="results"></div>
  </main>
  <script>
  async function init() {
    const res = await fetch('/search-index.json', {cache:'no-store'}).then(r=>r.json());
    const idx = lunr(function(){this.ref('id');this.field('title');this.field('body');res.forEach(d=>this.add(d),this)});
    const input = document.getElementById('q');
    const out = document.getElementById('results');
    input.addEventListener('input', ()=>{
      const q = input.value.trim(); if (!q) { out.innerHTML=''; return; }
      const hits = idx.search(q).slice(0,10).map(h=>{
        const doc = res.find(r=>r.id===h.ref); return `<div style="margin-bottom:1rem;"><a href="/${doc.id}" style="color:#0f0">${doc.title}</a><p style="color:#0a0">${doc.body.slice(0,200)}...</p></div>`;
      }); out.innerHTML = hits.join('') || '<p>No results</p>';
    });
  }
  init().catch(e=>console.error(e));
  </script>
</body>
</html>
