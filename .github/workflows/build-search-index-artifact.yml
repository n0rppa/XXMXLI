name: Build Search Index and Upload Artifact

on:
  push:
    paths:
      - '**.html'
      - 'tools/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do npm ci && break || sleep 5; done

      - name: Save npm debug info
        if: failure()
        run: |
          node -v > workflow-debug-node.txt || true
          npm -v > workflow-debug-npm.txt || true
          npm ci --loglevel verbose > npm-ci.log 2>&1 || true
          ls -la > repo-listing.txt || true
        shell: bash

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-build-debug
          path: |
            workflow-debug-node.txt
            workflow-debug-npm.txt
            npm-ci.log
            repo-listing.txt

      - name: Build search index
        run: npm run build-index

      - name: Upload search-index.json
        if: always()
        run: |
          if [ -f search-index.json ]; then echo 'uploading'; else echo 'search-index.json missing' && exit 1; fi
        uses: actions/upload-artifact@v4
        with:
          name: search-index
          path: search-index.json
