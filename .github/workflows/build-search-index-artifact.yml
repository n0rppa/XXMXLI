name: Build Search Index and Upload Artifact

on:
  push:
    paths:
      - '**.html'
      - 'tools/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do npm ci && break || sleep 5; done

      - name: Save npm debug info
        run: |
          node -v > workflow-debug-node.txt || true
          npm -v > workflow-debug-npm.txt || true
          npm ci --loglevel verbose > npm-ci.log 2>&1 || true
          ls -la > repo-listing.txt || true
        shell: bash
      - name: Upload debug artifacts (if any)
        run: |
          if [ -f workflow-debug-node.txt ] || [ -f npm-ci.log ]; then
            echo 'Uploading debug artifacts'
            mkdir -p debug-artifacts
            cp workflow-debug-node.txt debug-artifacts/ || true
            cp workflow-debug-npm.txt debug-artifacts/ || true
            cp npm-ci.log debug-artifacts/ || true
            cp repo-listing.txt debug-artifacts/ || true
          else
            echo 'No debug artifacts to upload'
            exit 0
          fi
        shell: bash
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-build-debug
          path: debug-artifacts

      - name: Build search index
        run: npm run build-index

      - name: Upload search-index.json (if present)
        run: |
          if [ -f search-index.json ]; then
            echo 'search-index.json present'
          else
            echo 'search-index.json missing; nothing to upload'
            exit 0
          fi
          mkdir -p search-artifact
          cp search-index.json search-artifact/
        shell: bash
      - name: Upload search-index artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-index
          path: search-artifact
