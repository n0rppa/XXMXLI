name: Build Search Index and Upload Artifact

on:
  push:
    paths:
      - '**.html'
      - 'tools/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build search index
        run: npm run build-index

      - name: Upload search-index.json
        uses: actions/upload-artifact@v4
        with:
          name: search-index
          path: search-index.json
