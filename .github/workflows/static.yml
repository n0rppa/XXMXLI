{
  "name": "xxmxli",
  "version": "1.0.0",
  "description": "XXMXLI Portfolio Website",
  "scripts": {
    "build": "echo 'No build step needed for static site'",
    "start": "echo 'Static HTML site - open index.html in browser'"
  },
  "repository": {
    "type": "git",
    "url": "https://github.com/yourusername/XXMXLI.git"
  },
  "author": "XXMXLI",
  "license": "MIT"
}

name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4