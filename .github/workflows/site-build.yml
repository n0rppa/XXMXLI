name: Site build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install deps
        run: |
          for i in 1 2 3; do npm ci && break || sleep 5; done

      - name: Save npm debug info
        run: |
          node -v > workflow-debug-node.txt || true
          npm -v > workflow-debug-npm.txt || true
          npm ci --loglevel verbose > npm-ci.log 2>&1 || true
          ls -la > repo-listing.txt || true
        shell: bash

      - name: Package debug artifacts (if any)
        run: |
          if [ -f workflow-debug-node.txt ] || [ -f npm-ci.log ]; then
            mkdir -p debug-artifacts
            cp workflow-debug-node.txt debug-artifacts/ || true
            cp workflow-debug-npm.txt debug-artifacts/ || true
            cp npm-ci.log debug-artifacts/ || true
            cp repo-listing.txt debug-artifacts/ || true
          else
            echo 'No debug artifacts to upload'
            exit 0
          fi
        shell: bash
      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-build-debug
          path: debug-artifacts

      - name: Optimize images
        run: node tools/optimize-images.js || true

      - name: Build search index
        run: node tools/build-search-index.js || true

      - name: Package search-index (if present)
        run: |
          if [ -f search-index.json ]; then
            mkdir -p search-artifact
            cp search-index.json search-artifact/
          else
            echo 'search-index.json not found; skipping package'
            exit 0
          fi
        shell: bash
      - name: Upload search-index artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-index
          path: search-artifact

      - name: Generate sitemap
        run: node tools/generate-sitemap.js || true
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download search-index artifact
        uses: actions/download-artifact@v4
        with:
          name: search-index
          path: .

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # if secrets are not provided, skip deploy (prevents parse-time secret usage issues)
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Netlify secrets missing; skipping deploy"
            exit 0
          fi
          # publish directory is repository root per netlify.toml
          netlify deploy --dir=. --prod --site=$NETLIFY_SITE_ID
