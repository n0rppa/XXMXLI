name: Site build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm ci || true
      - name: Optimize images
        run: node tools/optimize-images.js || true
      - name: Build search index
        run: node tools/build-search-index.js || true
      - name: Upload search-index artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-index
          path: search-index.json
      - name: Generate sitemap
        run: node tools/generate-sitemap.js || true
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.NETLIFY_AUTH_TOKEN && secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download search-index artifact
        uses: actions/download-artifact@v4
        with:
          name: search-index
          path: .

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # publish directory is repository root per netlify.toml
          netlify deploy --dir=. --prod --site=$NETLIFY_SITE_ID
