name: Site build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install deps
        run: |
          for i in 1 2 3; do npm ci && break || sleep 5; done

      - name: Optimize images
        run: node tools/optimize-images.js || true

      - name: Build search index
        run: node tools/build-search-index.js || true

      - name: Upload search-index artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-index
          path: search-index.json

      - name: Generate sitemap
        run: node tools/generate-sitemap.js || true
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.NETLIFY_AUTH_TOKEN && secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download search-index artifact
        uses: actions/download-artifact@v4
        with:
          name: search-index
          path: .

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # publish directory is repository root per netlify.toml
          netlify deploy --dir=. --prod --site=$NETLIFY_SITE_ID
