# XXMXLI Security Debug Optimizer Configuration
# Compatible with source command for bash scripts

# Core Settings
SEARCH_TIMEOUT=30
GREP_MAX_DEPTH=5
USE_OPTIMIZED_SEARCH=true
ENABLE_PREDICTIVE_CHECKS=true
CROSS_PLATFORM_MODE=true
DEPENDENCY_AUTO_INSTALL=false
VERBOSE_DEBUGGING=false
PERFORMANCE_MONITORING=true

# Error Reporting
ERROR_REPORTING_ENABLED=true
ERROR_REPORTING_FORMAT="json"
INCLUDE_RECOMMENDATIONS=true
SAVE_ANALYSIS_FILES=true

# Search Tool Configuration
SEARCH_TOOLS_ORDER="rg ag awk grep"
TIMEOUT_PER_TOOL=10
FALLBACK_ENABLED=true

# Optimization Settings
ADD_ERROR_HANDLING=true
REPLACE_UNSAFE_COMMANDS=true
ADD_TIMEOUT_PROTECTION=true
OPTIMIZE_LOOPS=true
ADD_LOGGING=true

# Cross-Platform Compatibility
TARGET_PLATFORMS="linux windows macos"
CHECK_SHELL_COMPATIBILITY=true
DETECT_PLATFORM_SPECIFIC_COMMANDS=true

# Maintenance Schedule
SCHEDULE_ENABLED=true
CHECK_FREQUENCY="weekly"
AUTO_BACKUP=true
CLEANUP_OLD_REPORTS=true
REPORT_RETENTION_DAYS=30

# Advanced Settings
PARALLEL_PROCESSING=true
MAX_CONCURRENT_JOBS=4
MEMORY_LIMIT="1GB"
TEMP_DIR="/tmp"
LOG_LEVEL="INFO"

# Security Settings
AUDIT_ENABLED=true
SECURE_MODE=true
VALIDATE_INPUTS=true
SANITIZE_OUTPUTS=true