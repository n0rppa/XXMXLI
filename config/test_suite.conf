# XXMXLI Comprehensive Test Suite Configuration
# Traditional .conf format for maximum compatibility

# Basic test configuration
PARALLEL_TESTS=4
TIMEOUT_SECONDS=300
PERFORMANCE_BASELINE_MS=100
SECURITY_SCAN_ENABLED=true

# Test categories
UNIT_TESTS_ENABLED=true
UNIT_TESTS_TIMEOUT=60
UNIT_TESTS_STRICT_MODE=false

INTEGRATION_TESTS_ENABLED=true
INTEGRATION_TESTS_TIMEOUT=120
INTEGRATION_DEPENDENCY_CHECK=true

PERFORMANCE_TESTS_ENABLED=true
PERFORMANCE_BASELINE_MS=100
PERFORMANCE_BENCHMARK_ITERATIONS=3

SECURITY_TESTS_ENABLED=true
SECURITY_SCAN_DEPTH="comprehensive"
SECURITY_CHECK_CREDENTIALS=true
SECURITY_CHECK_INJECTION=true
SECURITY_CHECK_PERMISSIONS=true

ERROR_HANDLING_TESTS_ENABLED=true
ERROR_TEST_MISSING_DEPS=true
ERROR_TEST_CORRUPT_CONFIG=true
ERROR_TEST_DISK_SPACE=true

# Reporting configuration
HTML_REPORTS_ENABLED=true
TEXT_REPORTS_ENABLED=true
JSON_REPORTS_ENABLED=true
INCLUDE_LOGS_IN_REPORTS=true
INCLUDE_METRICS_IN_REPORTS=true

# Optimization targets
PREFERRED_SEARCH_TOOLS="rg ag awk grep"
SEARCH_FALLBACK_ENABLED=true
SEARCH_TIMEOUT_PROTECTION=true
SEARCH_AUTO_DETECTION=true

# Performance targets
TARGET_STARTUP_TIME_MS=1000
TARGET_SEARCH_TIME_MS=100
MEMORY_EFFICIENT_MODE=true
CPU_OPTIMIZED_MODE=true

# Security settings
NO_HARDCODED_SECRETS=true
SECURE_FILE_PERMISSIONS=true
INPUT_VALIDATION_REQUIRED=true
SAFE_COMMAND_EXECUTION=true

# Error handling settings
GRACEFUL_DEGRADATION=true
USER_FRIENDLY_MESSAGES=true
AUDIT_LOGGING_ENABLED=true
RETRY_MECHANISMS_ENABLED=true

# Environment-specific settings
DEVELOPMENT_MODE=false
PRODUCTION_MODE=true
CI_CD_MODE=false
VERBOSE_LOGGING=false
QUICK_TESTS=false
COMPREHENSIVE_TESTS=true
SECURITY_FOCUSED=true
PARALLEL_EXECUTION=true
DETAILED_REPORTS=true
FAIL_FAST=false