# XXMXLI Security Monitor Configuration v2.0
# Traditional .conf format for maximum compatibility

# Performance Settings
SEARCH_TIMEOUT=30
PREFERRED_SEARCH_TOOL="rg"
MAX_CONCURRENT_OPERATIONS=4
CACHE_RESULTS=true
CACHE_TTL_SECONDS=300

# Logging Configuration
LOG_ENABLED=true
LOG_LEVEL="info"
LOG_RETENTION_DAYS=30
MAX_LOG_SIZE=100
ROTATE_ON_SIZE=true
COMPRESS_OLD_LOGS=true
DEBUG_LOG_ENABLED=false

# Monitoring Settings
CHECK_INTERVAL_SECONDS=60
FAILED_LOGIN_THRESHOLD=5
BLOCKED_IP_ALERT_THRESHOLD=100
AUTO_BLOCK_ENABLED=true
WHITELIST_ENABLED=true
WHITELIST_IPS="127.0.0.1,::1"

# Notification Settings
ENABLE_NOTIFICATIONS=true
NOTIFICATION_METHODS="log,console"
CRITICAL_ONLY=false
WEBHOOK_URL=""
EMAIL_ENABLED=false
EMAIL_SMTP_SERVER=""
EMAIL_SMTP_PORT=587
EMAIL_FROM="security@xxmxli.local"

# Security Settings
REQUIRE_ADMIN_AUTH=true
SESSION_TIMEOUT_MINUTES=30
MAX_FAILED_ATTEMPTS=3
LOCKOUT_DURATION_MINUTES=15
ENFORCE_HTTPS=true

# File Paths
HTACCESS_FILE=".htaccess"
ADMIN_HTACCESS="admin/.htaccess"
LOG_DIRECTORY="logs"
REPORT_DIRECTORY="reports"
BACKUP_DIRECTORY="backups"
TEMP_DIRECTORY="/tmp/xxmxli"

# Feature Flags
REAL_TIME_MONITORING=true
THREAT_INTELLIGENCE=true
AUTOMATED_BLOCKING=true
GEO_BLOCKING=false
RATE_LIMITING=true
HONEYPOT_DETECTION=false

# Maintenance Settings
AUTO_CLEANUP_ENABLED=true
CLEANUP_INTERVAL_DAYS=7
BACKUP_BEFORE_CLEANUP=true
HEALTH_CHECK_INTERVAL_HOURS=24
UPDATE_CHECK_ENABLED=true