debug_optimizer:
  search_timeout: 30
  grep_max_depth: 5
  use_optimized_search: true
  enable_predictive_checks: true
  cross_platform_mode: true
  dependency_auto_install: false
  verbose_debugging: false
  performance_monitoring: true
  
  error_reporting:
    enabled: true
    format: json
    include_recommendations: true
    save_analysis_files: true
  
  search_tools:
    preferred_order:
      - rg
      - ag
      - awk
      - grep
    timeout_per_tool: 10
    fallback_enabled: true
  
  optimization:
    add_error_handling: true
    replace_unsafe_commands: true
    add_timeout_protection: true
    optimize_loops: true
    add_logging: true
  
  compatibility:
    target_platforms:
      - linux
      - windows
      - macos
    check_shell_compatibility: true
    detect_platform_specific_commands: true
  
  maintenance:
    schedule_enabled: true
    check_frequency: weekly
    auto_backup: true
    cleanup_old_reports: true
    report_retention_days: 30